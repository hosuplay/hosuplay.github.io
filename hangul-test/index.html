<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(155deg,#fff1e9,#e7f5ff);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#514c56}

.speech{background:#f2f8ff;border:2px dashed #c9e4f8;border-radius:22px;padding:14px;margin:14px 0}
.speech p{margin:6px 0}
.letter{font-size:60px;font-weight:900;color:#5b7b9a}

.grid3{grid-template-columns:repeat(3,1fr)}
.grid2{grid-template-columns:repeat(2,1fr)}
.tile{min-height:74px;border-radius:21px;background:#e6f3ff;font-size:30px;font-weight:900;box-shadow:0 4px 0 #cde2f3;padding:6px}
.tile small{display:block;font-size:11px;font-weight:700;color:#6d8aa4}
.tile.picked,.tile.on{background:#ffe28b}
.tile:disabled{opacity:.55}
.primary{background:#ffe18b;padding:15px 12px;border-radius:21px;font-size:16px;font-weight:850;width:100%;margin:7px 0;box-shadow:0 4px 0 #e9c76b}
.soft{background:#e8f5ff}
.line{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

button.result{font-family:inherit;color:inherit}
button.result:active{transform:translateY(2px);box-shadow:0 2px 0 #ecd98f}
.picture{font-size:75px;margin:10px}

.progress{display:flex;align-items:center;gap:9px;justify-content:center;margin:14px 0}
.track{height:12px;background:#fff;border-radius:20px;overflow:hidden;flex:1;max-width:210px}
.fill{height:100%;background:#ffca69;transition:width .25s}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.cards button{background:#eaf6ff;border-radius:20px;padding:15px 7px;font-size:20px;font-weight:850}
.cards button span{display:block;font-size:39px;margin-bottom:7px}
a{color:#54789b}
footer{text-align:center;font-size:12px;color:#877e85;margin-top:25px}
.step{font-size:12px;font-weight:800;color:#a47c69}
.badge{display:inline-block;background:#dff3e4;color:#2e7d4f;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:850;margin:6px 0}

/* ── 입안 단면 그림 ── */
.mouthart{width:100%;max-width:360px;height:auto;display:block;margin:auto}
.mouthart .hot{animation:hot 2.2s ease-in-out infinite}

.artlabel{font:800 11px -apple-system,"Apple SD Gothic Neo",sans-serif;fill:#8a6a5c}

.cheonji{display:flex;justify-content:center;gap:14px;margin:12px 0;flex-wrap:wrap}

.bword{font-size:46px;font-weight:900;color:#5b7b9a}

<script>
'use strict';
const $=id=>document.getElementById(id);
const area=$('area'),statusBox=$('status');
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
function compose(a,b){
  const c=CHO.indexOf(a),j=JUNG.indexOf(b);
  const ci=c>-1?c:CHO.indexOf(b),ji=c>-1?j:JUNG.indexOf(a);
  return ci<0||ji<0?'':String.fromCharCode(0xAC00+ci*588+ji*28);
}
function speak(t){playHangul(t,statusBox)}
/* ── 1단계 · 자음 탄생 ── */
const CONS=[
{c:'ㄱ',shape:'velar',part:'목구멍',story:'혀 뒤쪽이 목구멍 쪽으로 살짝 말려서 소리를 막았다가 내보내요.',fam:['ㄱ','ㅋ'],famNote:'ㄱ에 획을 하나 더하면 바람이 센 ㅋ!'},
{c:'ㄴ',shape:'alveolar',part:'윗잇몸',story:'혀끝이 윗잇몸에 착 닿았다가 떨어지면서 소리를 내요.',fam:['ㄴ','ㄷ','ㅌ'],famNote:'ㄴ에 획을 더하면 ㄷ! 하나 더 더하면 ㅌ!'},
{c:'ㅁ',shape:'bilabial',part:'입술',story:'두 입술을 다물었다가 탁 하고 열어요. 네모처럼 각진 모양이에요.',fam:['ㅁ','ㅂ','ㅍ'],famNote:'ㅁ에 획을 더하면 ㅂ! 하나 더 더하면 ㅍ!'},
{c:'ㅅ',shape:'sibilant',part:'앞니',story:'앞니 사이로 바람이 쉬~ 하고 빠져나가요. 꼬부라진 모양이 바람이에요.',fam:['ㅅ','ㅈ','ㅊ'],famNote:'ㅅ에 획을 더하면 ㅈ! 하나 더 더하면 ㅊ!'},
{c:'ㅇ',shape:'glottal',part:'목구멍',story:'입 안 깊은 둥근 목구멍에서 소리가 울려요. 동그란 이 모양이 바로 목구멍!',fam:['ㅇ','ㅎ'],famNote:'ㅇ에 획을 더하면 바람 소리 ㅎ!'}
];
/* ── 입안 단면 SVG ── */
function glowAt(cx,cy,k){
  const r=k||1;
  return '<circle class="hot" cx="'+cx+'" cy="'+cy+'" r="'+Math.round(26*r)+'" fill="#ffd23f" opacity=".30"/>'
  +'<circle cx="'+cx+'" cy="'+cy+'" r="'+Math.round(18*r)+'" fill="#ffc61a" opacity=".55"/>'
  +'<circle cx="'+cx+'" cy="'+cy+'" r="'+Math.round(11*r)+'" fill="#f7a80d" opacity=".95"/>';
}
function mouthSVG(shape){
  const tongueUp=shape==='velar'
    ? '<ellipse cx="230" cy="104" rx="26" ry="15" fill="#e8557f" stroke="#c94f73" stroke-width="3" transform="rotate(-18 230 104)"/>'
    : shape==='alveolar'
    ? '<ellipse cx="112" cy="112" rx="22" ry="13" fill="#e8557f" stroke="#c94f73" stroke-width="3" transform="rotate(24 112 112)"/>'
    : '';
  const extra=shape==='bilabial'
    ? '<path d="M50,104 Q64,110 78,104" stroke="#c94f73" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50,128 Q64,122 78,128" stroke="#c94f73" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : shape==='sibilant'
    ? '<path d="M96,116 H240" stroke="#6bbcf5" stroke-width="6" stroke-dasharray="9 11" stroke-linecap="round" fill="none"/><path d="M106,102 L92,116 L106,130" stroke="#6bbcf5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
    : '';
  const glow=shape==='velar' ? glowAt(238,100)
    : shape==='alveolar' ? glowAt(104,98)
    : shape==='bilabial' ? glowAt(58,116,.9)
    : shape==='sibilant' ? glowAt(90,116,.95)
    : glowAt(266,114);
  return '<svg class="mouthart" viewBox="0 0 320 240" role="img" aria-label="입안 단면 그림">'
  +`<path d="M320,4 H140 Q70,4 70,76 V164 Q70,236 140,236 H320 Z" fill="#ffe6d3" stroke="#f3c3ab" stroke-width="4"/>
<path d="M72,96 C110,88 200,84 252,86 L268,116 L252,140 C200,142 110,138 72,132 Z" fill="#fde1e6"/>
<path d="M74,134 C104,118 140,116 180,118 C214,119 238,116 250,108 L252,140 C220,147 150,148 100,145 C86,144 76,140 74,134 Z" fill="#e8557f" stroke="#c94f73" stroke-width="3"/>
${tongueUp}
<path d="M100,90 C150,80 210,78 246,86" stroke="#c76d8b" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M240,86 Q252,96 250,110 Q244,102 238,92 Z" fill="#c76d8b"/>
<rect x="76" y="96" width="22" height="17" rx="4" fill="#fff" stroke="#e0cbbf" stroke-width="2.5"/>
<rect x="76" y="120" width="22" height="17" rx="4" fill="#fff" stroke="#e0cbbf" stroke-width="2.5"/>
<ellipse cx="58" cy="82" rx="16" ry="15" fill="#e8557f" stroke="#c94f73" stroke-width="3"/>
<ellipse cx="58" cy="150" rx="16" ry="15" fill="#e8557f" stroke="#c94f73" stroke-width="3"/>
<ellipse cx="272" cy="114" rx="15" ry="19" fill="#7b4351" stroke="#5d3341" stroke-width="3"/>
${extra}
${glow}
<line x1="30" y1="56" x2="46" y2="72" stroke="#c9a99a" stroke-width="1.5"/>
<text x="6" y="50" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">입술</text>
<line x1="58" y1="26" x2="80" y2="92" stroke="#c9a99a" stroke-width="1.5"/>
<text x="44" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">앞니</text>
<line x1="112" y1="34" x2="110" y2="88" stroke="#c9a99a" stroke-width="1.5"/>
<text x="98" y="28" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">윗잇몸</text>
<line x1="196" y1="22" x2="196" y2="78" stroke="#c9a99a" stroke-width="1.5"/>
<text x="176" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">입천장</text>
<line x1="146" y1="208" x2="150" y2="146" stroke="#c9a99a" stroke-width="1.5"/>
<text x="132" y="224" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">혀</text>
<line x1="286" y1="196" x2="276" y2="136" stroke="#c9a99a" stroke-width="1.5"/>
<text x="260" y="212" font-family="sans-serif" font-size="11" font-weight="800" fill="#8a6a5c">목구멍</text>`
  +'</svg>';
}

/* ── 2단계 · 천지인 모음 ── */
const VOWELS=[
{v:'ㅏ',s:'아',strokes:[['M40,15 V95','#3f5e7d'],['M40,55 H70','#e2593f']],note:'사람(ㅣ) + 땅(ㅡ)'},
{v:'ㅑ',s:'야',strokes:[['M40,15 V95','#3f5e7d'],['M40,35 H70','#e2593f'],['M40,72 H70','#e2593f']],note:'사람 + 땅 둘'},
{v:'ㅓ',s:'어',strokes:[['M40,15 V95','#3f5e7d'],['M12,55 H40','#e2593f']],note:'땅 + 사람'},
{v:'ㅕ',s:'여',strokes:[['M40,15 V95','#3f5e7d'],['M12,35 H40','#e2593f'],['M12,72 H40','#e2593f']],note:'땅 둘 + 사람'},
{v:'ㅗ',s:'오',strokes:[['M12,72 H68','#3f5e7d'],['M40,34 V72','#e2593f']],note:'땅(ㅡ) 위에 사람(ㅣ) 하나'},
{v:'ㅛ',s:'요',strokes:[['M10,76 H70','#3f5e7d'],['M28,32 V76','#e2593f'],['M52,32 V76','#e2593f']],note:'땅(ㅡ) 위에 사람 둘'},
{v:'ㅜ',s:'우',strokes:[['M12,38 H68','#3f5e7d'],['M40,38 V76','#e2593f']],note:'땅(ㅡ) 아래에 사람(ㅣ) 하나'},
{v:'ㅠ',s:'유',strokes:[['M10,34 H70','#3f5e7d'],['M28,34 V78','#e2593f'],['M52,34 V78','#e2593f']],note:'땅(ㅡ) 아래에 사람 둘'},
{v:'ㅡ',s:'으',strokes:[['M12,55 H68','#3f5e7d']],note:'땅(ㅡ) 그대로'},
{v:'ㅣ',s:'이',strokes:[['M40,15 V95','#3f5e7d']],note:'사람(ㅣ) 그대로'}
];
function strokeSVG(strokes){
  return '<svg viewBox="0 0 80 110" aria-hidden="true">'
  +strokes.map(s=>'<path d="'+s[0]+'" stroke="'+s[1]+'" stroke-width="9" stroke-linecap="round" fill="none"/>').join('')
  +'</svg>';
}
const CHEONJI=[
['<circle cx="40" cy="55" r="12" fill="#f2a93b"/>','하늘 · •'],
['<path d="M12,55 H68" stroke="#5e8c4a" stroke-width="9" stroke-linecap="round" fill="none"/>','땅 · ㅡ'],
['<path d="M40,15 V95" stroke="#4a6f96" stroke-width="9" stroke-linecap="round" fill="none"/>','사람 · ㅣ']
];
/* ── 3단계 · 소리 이어 읽기 ── */
const BLEND_STAGES=[
{name:'1단계 · 가나다라',cons:['ㄱ','ㄴ','ㄷ','ㄹ'],vows:['ㅏ','ㅣ']},
{name:'2단계 · 머버서어',cons:['ㅁ','ㅂ','ㅅ','ㅇ'],vows:['ㅓ','ㅜ']},
{name:'3단계 · 조초코토포호',cons:['ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],vows:['ㅗ','ㅡ']}
];
/* ── 4단계 · 낱말 읽기 ── */
const WORDS=[
{w:'나비',pic:'🦋'},{w:'모자',pic:'🧢'},{w:'사과',pic:'🍎'},{w:'바나나',pic:'🍌'},{w:'가방',pic:'🎒'},
{w:'우유',pic:'🥛'},{w:'공',pic:'⚽'},{w:'달',pic:'🌙'},{w:'별',pic:'⭐'},{w:'집',pic:'🏠'}
];
/* ── 5단계 · 받침 ── */
const BATCHIM=[
{w:'공',pic:'⚽',b:'ㅇ',shape:'velar',story:'혀 뒤가 입천장 뒤쪽을 막아서, 소리가 코로 웅 웅 울려요.'},
{w:'눈',pic:'❄️',b:'ㄴ',shape:'alveolar',story:'혀끝이 윗잇몸에 착 닿아서 소리가 닫혀요.'},
{w:'달',pic:'🌙',b:'ㄹ',shape:'alveolar',story:'혀끝이 윗잇몸을 스르륵 스치듯 지나가요.'},
{w:'밥',pic:'🍚',b:'ㅂ',shape:'bilabial',story:'두 입술이 사각 닫혀서 소리를 막아요.'},
{w:'강',pic:'🌊',b:'ㅇ',shape:'velar',story:'혀 뒤가 목 안쪽을 막고, 소리가 코로 웅 하고 울려요.'},
{w:'집',pic:'🏠',b:'ㅂ',shape:'bilabial',story:'끝에서 두 입술이 폭 닫혀요.'}
];
/* ── 진행 저장 ── */
const key='hosu-hangul-v2';
let saved={stars:0,done:{}};
try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){}
if(!saved.done)saved.done={};
function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}updateProgress()}
function updateProgress(){
  $('stars').textContent='⭐ '+saved.stars;
  const done=Object.keys(saved.done).length;
  $('count').textContent=done+'개 단계 완료';
  $('fill').style.width=(done/5*100)+'%';
}
function completeStep(){
  if(saved.done[tab])return;
  saved.done[tab]=true;
  saved.stars++;
  save();
  if(window.HosuStudy)HosuStudy.award('hangul');
}
function badge(){return saved.done[tab]?'<div class="badge">✅ 이 단계 완료!</div>':''}
/* ── 탭 상태 ── */
let tab='cons';
let S={}; /* 단계별 임시 상태 */
function setState(o){S=o||{}}
/* ── 렌더 ── */
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  statusBox.textContent='';
  setState(null);
  if(tab==='cons')renderCons();
  else if(tab==='vowel')renderVowel();
  else if(tab==='blend')renderBlend();
  else if(tab==='word')renderWord();
  else renderBatchim();
}
/* 1단계 */
function renderCons(){
  setState({sel:0});
  area.innerHTML='<div class="step">1단계 · 자음 탄생</div><h2>입안 그림으로 글자 탄생 보기</h2>'
  +'<p class="small">대장 자음을 눌러 보세요. 혀·입술·목구멍이 닿는 곳이 노랗게 빛나요.</p>'
  +'<div class="line">'+CONS.map((d,i)=>'<button data-con="'+i+'">'+d.c+'</button>').join('')+'</div>'
  +'<div id="conview"></div>'+badge();
  showCon(0);
}
function showCon(i,sayIt){
  S.sel=i;
  S.visited=S.visited||new Set();
  S.visited.add(i);
  if(S.visited.size>=CONS.length)completeStep();
  const d=CONS[i];
  const view=$('conview');
  view.innerHTML='<div class="letter" style="margin-top:14px">'+d.c+'</div>'
  +mouthSVG(d.shape)
  +'<div class="speech"><strong>'+d.c+' 이야기</strong><p>'+d.story+'</p><p class="small">닿는 곳: <strong>'+d.part+'</strong></p></div>'
  +'<button class="primary soft" data-say="'+compose(d.c,'ㅏ')+'">🔊 '+d.c+' 소리 듣기 ('+compose(d.c,'ㅏ')+' 처럼)</button>'
  +'<h3>획 더하기 놀이</h3><p class="small">'+d.famNote+'</p>'
  +'<div class="line">'+d.fam.map((f,fi)=>'<button class="tile" data-say="'+compose(f,'ㅡ')+'" style="min-width:76px">'+f+'<small>획 '+(fi+1)+' · '+compose(f,'ㅡ')+'</small></button>').join('')+'</div>'
  +'<p class="small">획을 누를 때마다 소리가 어떻게 달라지는지 들어 보세요. (소리한글처럼 ㅡ를 붙여 읽어요)</p>';
  area.querySelectorAll('[data-con]').forEach((b,bi)=>b.classList.toggle('on',bi===i));
  if(sayIt)speak(compose(d.c,'ㅏ'));
}
/* 2단계 */
function renderVowel(){
  area.innerHTML='<div class="step">2단계 · 모음 비밀</div><h2>하늘 · 땅 · 사람이 만나면</h2>'
  +'<p class="small">모음은 점과 선으로 태어났어요. 하늘은 점(•), 땅은 가로선(ㅡ), 사람은 세로선(ㅣ)!</p>'
  +'<div class="cheonji">'+CHEONJI.map(c=>'<figure><svg viewBox="0 0 80 110">'+c[0]+'</svg><figcaption>'+c[1]+'</figcaption></figure>').join('')+'</div>'
  +'<p class="small">만들어진 모음을 눌러 소리를 들어 보세요. 빨간 선이 새로 더해진 획이에요.</p>'
  +'<div class="vowgrid">'+VOWELS.map(d=>'<button data-say="'+d.s+'">'+strokeSVG(d.strokes)+'<span class="vsound">'+d.v+'</span></button>').join('')+'</div>'
  +'<button class="primary" data-vquiz>🎯 소리 듣고 모음 고르기</button>'
  +'<p class="small">모음만 더 연습하고 싶으면 <a href="/hangul-test/vowels/">모음 소리 탐험</a>으로 이어가요.</p>'
  +badge();
}
function vowelQuiz(){
  const targets=['ㅏ','ㅓ','ㅗ','ㅜ','ㅣ'];
  setState({round:0});
  q();
  function q(){
    const t=targets[S.round];
    const info=VOWELS.find(v=>v.v===t);
    const others=targets.filter(x=>x!==t).sort(()=>Math.random()-.5).slice(0,2);
    const opts=[t,...others].sort(()=>Math.random()-.5);
    area.innerHTML='<div class="step">2단계 · 모음 비밀</div><h2>소리를 듣고 모음을 골라요</h2>'
    +'<div class="result">'+(S.round+1)+' / '+targets.length+'</div>'
    +'<button class="primary soft" data-say="'+info.s+'">🔊 다시 듣기</button>'
    +'<div class="grid grid3">'+opts.map(o=>'<button class="tile" data-vanswer="'+o+'">'+o+'</button>').join('')+'</div>';
    statusBox.textContent='소리를 듣고 맞는 모음을 눌러요!';
    speak(info.s);
  }
  S.vq=q;
  S.vtargets=targets;
}
/* 3단계 */
function renderBlend(){
  setState({stage:0,pickedC:null,built:0});
  blendView();
}
function blendView(){
  const st=BLEND_STAGES[S.stage];
  area.innerHTML='<div class="step">3단계 · 소리 이어 읽기</div><h2>소리를 이어서 읽어요</h2>'
  +'<p class="small">'+st.name+' · 자음을 먼저 고르고, 모음을 고르면 소리가 이어져요!</p>'
  +'<h3>자음</h3><div class="line">'+st.cons.map(c=>'<button data-bc="'+c+'">'+c+'</button>').join('')+'</div>'
  +'<h3>모음</h3><div class="line">'+st.vows.map(v=>'<button data-bv="'+v+'">'+v+'</button>').join('')+'</div>'
  +'<button type="button" class="result" id="blendview">_ + _ = ?</button>'
  +'<p class="small">'+S.built+' / 6 만들었어요. 6개를 만들면 다음 단계 자음도 만나요!</p>'+badge();
  statusBox.textContent='먼저 자음을 골라요!';
}
/* 4단계 */
function renderWord(){
  setState({mode:'match',right:0,seq:0});
  wordQ();
}
function wordQ(){
  const t=WORDS[Math.floor(Math.random()*WORDS.length)];
  S.expect=t.w;
  S.expectPic=t.pic;
  const opts=WORDS.filter(w=>w.w!==t.w).sort(()=>Math.random()-.5).slice(0,3);
  opts.push(t);opts.sort(()=>Math.random()-.5);
  const match=S.mode==='match';
  const head=match
    ?'<div class="picture">'+t.pic+'</div><p>그림에 맞는 낱말은 뭘까요?</p>'
    :'<div class="picture" style="font-size:56px">🐰🥕</div><p>소리를 듣고 토끼에게 알맞은 간식을 골라요!</p><button class="primary soft" data-say="'+t.w+'">🔊 문제 다시 듣기</button>';
  area.innerHTML='<div class="step">4단계 · 낱말 읽기 & 토끼 간식</div><h2>'+(match?'그림 보고 낱말 읽기':'아기토끼 간식 주기')+'</h2>'
  +'<div class="result">'+(S.right+1)+' / '+(match?3:2)+'</div>'+head
  +'<div class="grid grid2">'+opts.map(o=>'<button class="tile" data-wanswer="'+o.w+'"'+(match?'':' style="font-size:20px"')+'>'+(match?o.w:'<span>'+o.pic+'</span>'+o.w)+'</button>').join('')+'</div>';
  statusBox.textContent=match?'그림을 보고 낱말을 골라요.':'낱말 소리를 듣고 골라요!';
  if(!match)speak(t.w);
}
/* 5단계 */
function renderBatchim(){
  setState({sel:0});
  batchView(0);
}
function batchView(i){
  S.sel=i;
  const d=BATCHIM[i];
  area.innerHTML='<div class="step">5단계 · 받침 첫걸음</div><h2>받침이 만나면 입안이 달라져요</h2>'
  +'<div class="bword">'+d.w+' <span style="font-size:24px;color:#e2593f;vertical-align:middle">받침 '+d.b+'</span> <span style="font-size:34px">'+d.pic+'</span></div>'
  +mouthSVG(d.shape)
  +'<div class="speech"><strong>받침 '+d.b+' 이야기</strong><p>'+d.story+'</p></div>'
  +'<button class="primary soft" data-say="'+d.w+'">🔊 '+d.w+' 듣기</button>'
  +'<div class="line">'+BATCHIM.map((x,xi)=>'<button data-bw="'+xi+'">'+x.w+'</button>').join('')+'</div>'
  +'<button class="primary" data-bquiz>🎯 받침 소리 퀴즈</button>'+badge();
  area.querySelectorAll('[data-bw]').forEach((b,bi)=>b.classList.toggle('on',bi===i));
  statusBox.textContent='받침이 붙은 글자를 눌러 소리를 들어 보세요!';
}
function batchQuiz(){
  const d=BATCHIM[Math.floor(Math.random()*BATCHIM.length)];
  S.bqAnswer=d;
  const opts=[
    {t:'두 입술이 폭 닫혀요',shape:'bilabial'},
    {t:'혀끝이 윗잇몸에 닿아요',shape:'alveolar'},
    {t:'혀 뒤가 목 안쪽을 막아요',shape:'velar'}
  ];
  const correct=opts.find(o=>o.shape===d.shape);
  S.bqCorrect=correct.t;
  const choices=[correct,...opts.filter(o=>o!==correct).slice(0,2)].sort(()=>Math.random()-.5);
  area.innerHTML='<div class="step">5단계 · 받침 첫걸음</div><h2>이 받침은 어디서 닫힐까요?</h2>'
  +'<div class="bword">'+d.w+' <span style="font-size:34px">'+d.pic+'</span></div>'
  +'<button class="primary soft" data-say="'+d.w+'">🔊 '+d.w+' 듣기</button>'
  +'<div class="grid">'+choices.map(c=>'<button class="tile" style="font-size:18px" data-bcanswer="'+c.t+'">'+c.t+'</button>').join('')+'</div>';
  statusBox.textContent='받침 '+d.b+' · 소리가 어디서 닫히는지 골라요!';
  speak(d.w);
}
/* ── 클릭 위임 (한 번만 등록) ── */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  if(!area.contains(b))return;
  if(b.dataset.say!==undefined&&b.dataset.say){speak(b.dataset.say);return}
  if(b.dataset.con!==undefined&&b.dataset.con){showCon(+b.dataset.con,true);return}
  if(b.hasAttribute('data-vquiz')){vowelQuiz();return}
  if(b.dataset.vanswer){
    const t=S.vtargets&&S.vtargets[S.round];
    if(b.dataset.vanswer===t){
      statusBox.textContent='정답! '+t+' ⭐';
      S.round++;
      if(S.round<S.vtargets.length)setTimeout(S.vq,900);
      else{completeStep();render()}
    }else statusBox.textContent='한 번 더 들어 볼까요?';
    return;
  }
  if(b.dataset.bc){ /* 3단계 자음 */
    S.pickedC=b.dataset.bc;
    area.querySelectorAll('[data-bc]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    statusBox.textContent=S.pickedC+' 을(를) 골랐어요! 이제 모음을 고르세요.';
    return;
  }
  if(b.dataset.bv){ /* 3단계 모음 → 합체 */
    if(!S.pickedC){statusBox.textContent='자음을 먼저 골라요!';return}
    const syl=compose(S.pickedC,b.dataset.bv);
    const view=$('blendview');
    if(view){
      view.dataset.say=syl;
      view.innerHTML=S.pickedC+' + '+b.dataset.bv+' → '+syl+' 🔊';
    }
    speak(syl);
    S.built=(S.built||0)+1;
    if(S.built>=6){
      completeStep();
      statusBox.textContent=syl+' 완성! 다음 단계 자음 만나러 가요! ⭐';
      setTimeout(()=>{S.stage=(S.stage+1)%BLEND_STAGES.length;S.pickedC=null;S.built=0;blendView()},1500);
    }else{
      statusBox.textContent=syl+' ! 또 만들어 볼까요?';
      S.pickedC=null;
      const p=area.querySelector('p.small:last-of-type');
      if(p)p.textContent=S.built+' / 6 만들었어요. 6개를 만들면 다음 단계 자음도 만나요!';
      setTimeout(()=>area.querySelectorAll('.line .on').forEach(x=>x.classList.remove('on')),900);
    }
    return;
  }
  if(b.dataset.wanswer){ /* 4단계 정답 */
    if(b.dataset.wanswer!==S.expect){statusBox.textContent='한 번 더 살펴볼까요?';return}
    S.right++;
    statusBox.textContent='정답! '+b.dataset.wanswer+' ⭐';
    speak(b.dataset.wanswer);
    if(S.mode==='match'&&S.right>=3){S.mode='feed';S.right=0;statusBox.textContent='이제 토끼에게 간식을 주러 가요!';setTimeout(wordQ,1200);return}
    if(S.mode==='feed'&&S.right>=2){completeStep();statusBox.textContent='낱말 읽기 완료! ⭐';setTimeout(wordQ,1200);return}
    setTimeout(wordQ,1000);
    return;
  }
  if(b.dataset.bw!==undefined&&b.dataset.bw){
    batchView(+b.dataset.bw);
    speak(BATCHIM[+b.dataset.bw].w);
    return;
  }
  if(b.hasAttribute('data-bquiz')){batchQuiz();return}
  if(b.dataset.bcanswer){
    if(b.dataset.bcanswer!==S.bqCorrect){statusBox.textContent='다시 들여다봐요!';return}
    statusBox.textContent='정답! '+S.bqAnswer.w+' ⭐';
    S.bqRight=(S.bqRight||0)+1;
    if(S.bqRight>=3)completeStep();
    setTimeout(()=>batchView(S.sel),1300);
    return;
  }
});
updateProgress();
render();
</script></body></html>
