<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호수플레이 한글놀이터</title><style>*{box-sizing:border-box}body{margin:0;background:#fff0ed;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#574b50}main{max-width:480px;margin:auto;padding:22px 14px 50px;text-align:center}h1{font-size:27px}.panel{background:#fffefa;border:3px solid white;border-radius:34px;padding:24px 14px;box-shadow:0 8px 0 #f4d8cf}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}button{border:0;border-radius:18px;padding:14px 8px;font:inherit;font-weight:800;color:inherit;background:#ffe2dc;cursor:pointer;touch-action:manipulation}nav button{background:white;font-size:14px}nav button.active,.primary{background:#ffda83}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.tile{font-size:36px;min-height:80px;background:#e8f5ff}.big{font-size:72px;margin:12px}.result{font-size:42px;background:#fff2c7;border-radius:20px;padding:18px;margin:14px 0}.status{min-height:46px;font-weight:750;line-height:1.5}.primary{width:100%;margin:8px 0}.small{font-size:13px;color:#857980}.bear{font-size:80px}a{color:inherit}</style></head><body><main><h1>🐰 호수플레이 한글놀이터</h1><p>글자를 만들고 아기토끼에게 당근을 줘요!</p><nav><button class="active" data-tab="syllable">① 글자 만들기</button><button data-tab="word">② 낱말 찾기</button><button data-tab="feed">③ 냠냠 게임</button></nav><section class="panel"><div class="bear">🐰</div><div id="content"></div><div class="status" id="status" aria-live="polite"></div></section><p class="small">별도 테스트 화면 · 기존 호수플레이 메뉴는 그대로</p><a href="/">← 호수플레이 홈</a></main><script>const data=[{c:'ㄱ',v:'ㅏ',s:'가',word:'가방',pic:'🎒'},{c:'ㄴ',v:'ㅏ',s:'나',word:'나비',pic:'🦋'},{c:'ㅁ',v:'ㅜ',s:'무',word:'무지개',pic:'🌈'},{c:'ㅂ',v:'ㅏ',s:'바',word:'바나나',pic:'🍌'},{c:'ㅅ',v:'ㅗ',s:'소',word:'소',pic:'🐮'}];let tab='syllable',idx=0,chosen=[],hearts=0;const content=document.querySelector('#content'),status=document.querySelector('#status');function say(t){if(!('speechSynthesis'in window)){status.textContent='이 브라우저는 음성 읽기를 지원하지 않아.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.8;speechSynthesis.speak(u)}function render(){const d=data[idx];chosen=[];document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='syllable'){content.innerHTML='<h2>자음과 모음을 합쳐봐!</h2><div class="grid"><button class="tile" data-part="'+d.c+'">'+d.c+'</button><button class="tile" data-part="'+d.v+'">'+d.v+'</button><button class="tile" data-part="wrong">ㅣ</button></div><div class="result" id="result">_ + _ = ?</div><button class="primary" data-next>다음 글자 →</button>';status.textContent='자음부터 눌러볼까?'}else if(tab==='word'){content.innerHTML='<h2>그림의 이름을 찾아봐!</h2><div class="big">'+d.pic+'</div><div class="grid">'+[d.word,...data.filter(x=>x.word!==d.word).slice(0,2).map(x=>x.word)].sort().map(x=>'<button data-answer="'+x+'">'+x+'</button>').join('')+'</div><button class="primary" data-next>다음 그림 →</button>';status.textContent='그림과 맞는 낱말을 골라봐!'}else{content.innerHTML='<h2>아기토끼가 배고프대!</h2><p>단어를 듣고 알맞은 그림 간식을 골라줘!</p><button class="primary" data-say="'+d.word+'">🔊 '+d.word+' 듣기</button><div class="grid">'+[d.pic,...data.filter(x=>x.word!==d.word).slice(0,2).map(x=>x.pic)].sort().map(x=>'<button class="tile" data-food="'+x+'">'+x+'</button>').join('')+'</div><p>❤️ '+hearts+'개</p><button class="primary" data-next>다음 문제 →</button>';status.textContent='정답을 고르면 냠냠!'}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=data[idx];if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.hasAttribute('data-next')){idx=(idx+1)%data.length;render()}else if(b.hasAttribute('data-part')){let want=chosen.length===0?d.c:d.v;if(b.dataset.part!==want){status.textContent='다른 글자를 골라볼까?';return}chosen.push(want);b.disabled=true;b.style.background='#ffda83';document.querySelector('#result').textContent=chosen.length===1?d.c+' + _ = ?':d.c+' + '+d.v+' = '+d.s;if(chosen.length===2){status.textContent='정답! '+d.s+' 🎉';say(d.s)}else status.textContent='이제 모음을 골라봐!'}else if(b.dataset.answer){status.textContent=b.dataset.answer===d.word?'정답! '+d.word+' 🎉':'다시 골라볼까?';if(b.dataset.answer===d.word)say(d.word)}else if(b.dataset.food){if(b.dataset.food===d.pic){hearts++;status.textContent='냠냠! 🐰🥕 '+d.word+' 정답!';b.disabled=true}else status.textContent='다시 골라봐!'}else if(b.dataset.say)say(b.dataset.say)});render();</script></body></html>
