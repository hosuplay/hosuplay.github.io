<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0e9"><title>호수플레이 | 토끼 한글 소리놀이터</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#fff1e9,#e7f5ff);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#514c56}button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}main{max-width:510px;margin:auto;padding:18px 15px 65px}header{text-align:center}h1{font-size:26px;margin:9px 0 4px}.sub{font-size:14px;color:#847780;margin:5px}.tag{display:inline-block;padding:6px 12px;border-radius:50px;background:#fff;border:2px solid #ffe1d0;font-size:12px;font-weight:800}.hero{font-size:67px;margin:10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0}.tabs button{padding:12px 2px;border-radius:18px;background:#fff;font-size:12px;font-weight:800;box-shadow:0 3px 0 #e4d7d0}.tabs .on{background:#ffe28b}.panel{background:#fffefa;border:3px solid #fff;border-radius:34px;padding:19px 15px 25px;box-shadow:0 8px 0 #ead7ce;text-align:center}h2{font-size:22px;margin:10px 0}h3{font-size:17px}.small{font-size:13px;line-height:1.55;color:#817780}.speech{background:#f2f8ff;border:2px dashed #c9e4f8;border-radius:22px;padding:14px;margin:14px 0}.mouth{display:inline-flex;width:125px;height:118px;border-radius:48% 48% 44% 44%;background:#ffe1c8;align-items:center;justify-content:center;border:4px solid #f5c9ac;margin:5px}.lips{background:#b75c70;width:57px;height:22px;border:5px solid #e99aa5;border-radius:50%}.lips.round{width:34px;height:37px;border-radius:50%}.lips.open{width:52px;height:58px;border-radius:48%}.lips.wide{width:70px;height:16px}.lips.closed{height:7px;width:54px}.letter{font-size:60px;font-weight:900;color:#5b7b9a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0}.tile{min-height:74px;border-radius:21px;background:#e6f3ff;font-size:32px;font-weight:900;box-shadow:0 4px 0 #cde2f3}.tile:disabled{opacity:.55}.tile.picked{background:#ffe28b}.primary{background:#ffe18b;padding:15px 12px;border-radius:21px;font-size:16px;font-weight:850;width:100%;margin:7px 0;box-shadow:0 4px 0 #e9c76b}.soft{background:#e8f5ff}.line{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.line button{border-radius:16px;padding:11px 13px;background:#f9e6ef;font-weight:800}.result{font-size:34px;font-weight:900;background:#fff3c8;border-radius:20px;padding:16px;margin:14px 0}.picture{font-size:75px;margin:10px}.status{min-height:55px;margin-top:14px;padding:11px;border-radius:18px;background:#fff2f0;font-weight:800;line-height:1.6}.progress{display:flex;align-items:center;gap:9px;justify-content:center;margin:14px 0}.track{height:12px;background:#fff;border-radius:20px;overflow:hidden;flex:1;max-width:210px}.fill{height:100%;background:#ffca69}.choice{border-radius:18px;background:#e9f4ff;padding:14px 4px;font-size:21px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cards button{background:#eaf6ff;border-radius:20px;padding:15px 7px;font-size:20px;font-weight:850}.cards button span{display:block;font-size:39px;margin-bottom:7px}.note{border:1px solid #f0d9ce;border-radius:17px;padding:10px;margin:12px 0;text-align:left;font-size:12px;line-height:1.6;background:#fffaf5}a{color:#54789b}footer{text-align:center;font-size:12px;color:#877e85;margin-top:25px}.hidden{display:none}.step{font-size:12px;font-weight:800;color:#a47c69}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.toolbar button{background:#fff;border-radius:15px;padding:9px 13px;font-size:13px}.stars{font-weight:900;color:#b87b2f}button:focus-visible{outline:3px solid #6da8e8;outline-offset:3px}@media(max-width:365px){.tabs button{font-size:11px}.panel{padding:15px 10px}.tile{min-height:65px}}
</style></head><body><main><header><span class="tag">🌷 소리부터 배우는 한글</span><h1>🐰 토끼 한글놀이터</h1><p class="sub">입모양을 보고 · 소리를 듣고 · 글자를 만들어요</p></header><div class="progress"><span class="stars" id="stars">⭐ 0</span><div class="track"><div class="fill" id="fill" style="width:0%"></div></div><span id="count">0개 성공</span></div><nav class="tabs"><button data-tab="mouth" class="on">👄 소리</button><button data-tab="join">🧩 합치기</button><button data-tab="word">🖼️ 낱말</button><button data-tab="feed">🥕 냠냠</button></nav><section class="panel"><div class="hero" id="mascot">🐰</div><div id="area"></div><div class="status" id="status" role="status" aria-live="polite"></div></section><footer><a href="/">← 호수플레이 홈</a><p>테스트 놀이터 · 이 기기에 학습 별과 복습 목록 저장</p></footer></main>
<script>
'use strict';
const lessons=[
{c:'ㅁ',v:'ㅏ',s:'마',word:'마차',pic:'🚃',guide:'입술을 가볍게 붙였다가 열면서 소리를 내요.',shape:'closed',tip:'ㅁ은 입술을 붙여 시작해요.'},
{c:'ㄴ',v:'ㅏ',s:'나',word:'나비',pic:'🦋',guide:'혀끝을 윗잇몸에 가볍게 댔다가 떼요.',shape:'open',tip:'ㄴ은 혀끝의 위치가 중요해요.'},
{c:'ㄱ',v:'ㅏ',s:'가',word:'가방',pic:'🎒',guide:'혀의 뒤쪽이 입천장 뒤쪽에 닿았다 떨어져요.',shape:'open',tip:'ㄱ은 입술보다 입안의 혀 움직임을 살펴봐요.'},
{c:'ㅅ',v:'ㅏ',s:'사',word:'사과',pic:'🍎',guide:'이를 가까이 두고 좁은 틈으로 바람을 내보내요.',shape:'wide',tip:'ㅅ은 바람이 지나가는 소리예요.'},
{c:'ㅁ',v:'ㅗ',s:'모',word:'모자',pic:'🧢',guide:'입술을 둥글게 모아 ㅗ 소리를 내요.',shape:'round',tip:'ㅗ는 입술을 동그랗게 모아요.'},
{c:'ㄴ',v:'ㅜ',s:'누',word:'누나',pic:'👧',guide:'입술을 앞으로 오므려 ㅜ 소리를 내요.',shape:'round',tip:'ㅜ는 입술을 앞으로 내밀어요.'},
{c:'ㅁ',v:'ㅣ',s:'미',word:'미소',pic:'😊',guide:'입술을 양옆으로 펴서 ㅣ 소리를 내요.',shape:'wide',tip:'ㅣ는 입술이 옆으로 펴져요.'},
{c:'ㅂ',v:'ㅏ',s:'바',word:'바나나',pic:'🍌',guide:'두 입술을 붙였다가 떼면서 소리를 내요.',shape:'closed',tip:'ㅂ은 두 입술이 만났다가 떨어져요.'}
];
const $=id=>document.getElementById(id),area=$('area'),status=$('status');let tab='mouth',idx=0,stage=0,selected=[],locked=false;const key='hosu-hangul-progress-v1';let saved={stars:0,success:[],review:[]};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}updateProgress()}function updateProgress(){$('stars').textContent='⭐ '+saved.stars;$('count').textContent=saved.success.length+'개 성공';$('fill').style.width=Math.min(100,saved.success.length/lessons.length*100)+'%'}function reward(){let k=idx+'-'+tab;if(!saved.success.includes(k)){saved.success.push(k);saved.stars++;}saved.review=saved.review.filter(x=>x!==idx);save()}function miss(){if(!saved.review.includes(idx))saved.review.push(idx);save()}function say(text){if(!('speechSynthesis'in window)){status.textContent='이 기기에서는 음성 읽기를 지원하지 않아요.';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.75;u.onerror=()=>status.textContent='음성 재생이 안 됐어요. 다시 눌러보세요.';speechSynthesis.speak(u)}catch(e){status.textContent='소리를 재생하지 못했어요.'}}function next(){idx=(idx+1)%lessons.length;stage=0;render()}function render(){let d=lessons[idx];locked=false;selected=[];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('mascot').textContent=tab==='feed'?'🐰🥕':'🐰';let number='<div class="step">놀이 '+(idx+1)+' / '+lessons.length+'</div>';if(tab==='mouth'){let vowel={ 'ㅏ':['입을 크게 벌리고 옆으로 펴요.','open'],'ㅗ':['입술을 둥글게 모아요.','round'],'ㅜ':['입술을 앞으로 오므려요.','round'],'ㅣ':['입술을 양옆으로 펴요.','wide']}[d.v];area.innerHTML=number+'<h2>입모양과 소리 탐험</h2><div class="line"><button data-kind="con">자음 '+d.c+'</button><button data-kind="vow">모음 '+d.v+'</button></div><div class="mouth" aria-label="단순화된 입모양 그림"><div class="lips '+(stage===0?d.shape:vowel[1])+'"></div></div><div class="letter">'+(stage===0?d.c:d.v)+'</div><div class="speech" id="guide">'+(stage===0?d.guide:vowel[0])+'</div><p class="small">입모양은 이해를 돕는 단순 그림이에요. 혀의 위치는 설명을 함께 읽어주세요.</p><button class="primary" data-syllable>🔊 완성 글자 '+d.s+' 듣기</button><button class="primary soft" data-next>다음 소리 →</button>';status.textContent='자음과 모음을 눌러 움직임을 비교해 봐요. 개별 자음의 정확한 음원은 아직 준비 중이에요.'}
if(tab==='join'){let pool=[d.c,d.v,idx%2?'ㅗ':'ㅣ'];area.innerHTML=number+'<h2>소리를 합쳐 글자를 만들자!</h2><p>자음부터, 다음은 모음!</p><div class="result" id="built">_ + _ = ?</div><div class="grid">'+pool.map((x,i)=>'<button class="tile" data-part="'+x+'" data-id="'+i+'">'+x+'</button>').join('')+'</div><button class="primary soft" data-syllable>🔊 '+d.s+' 듣기</button><button class="primary" data-next>다음 글자 →</button>';status.textContent='먼저 '+d.c+'을 찾아볼까요?'}
if(tab==='word'){let options=[d,...lessons.filter((v,i)=>i!==idx).slice(0,3)];area.innerHTML=number+'<h2>그림과 낱말을 연결해요</h2><div class="picture">'+d.pic+'</div><p>그림에 맞는 낱말은 뭘까요?</p><div class="cards">'+options.sort((a,b)=>a.word.localeCompare(b.word,'ko')).map(v=>'<button data-answer="'+v.word+'">'+v.word+'</button>').join('')+'</div><button class="primary soft" data-say="'+d.word+'">🔊 낱말 듣기</button><button class="primary" data-next>다음 그림 →</button>';status.textContent='그림을 보고 낱말을 골라봐요.'}
if(tab==='feed'){let options=[d,...lessons.filter((v,i)=>i!==idx).slice(0,3)];area.innerHTML=number+'<h2>아기토끼 간식 시간!</h2><p>낱말을 듣고 알맞은 그림을 골라주세요.</p><button class="primary" data-say="'+d.word+'">🔊 문제 듣기</button><div class="cards">'+options.sort((a,b)=>a.word.localeCompare(b.word,'ko')).map(v=>'<button data-food="'+v.word+'"><span>'+v.pic+'</span>'+v.word+'</button>').join('')+'</div><button class="primary soft" data-next>다음 간식 →</button>';status.textContent='정답이면 아기토끼가 냠냠!'}
if(saved.review.length)area.insertAdjacentHTML('beforeend','<div class="note">📝 복습할 글자 '+saved.review.length+'개 · <button data-review style="padding:5px 9px;border-radius:10px;background:#ffe4a4">다시 풀기</button></div>');}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=lessons[idx];if(b.dataset.tab){tab=b.dataset.tab;stage=0;render();return}if(b.hasAttribute('data-next')){next();return}if(b.dataset.kind){stage=b.dataset.kind==='con'?0:1;render();return}if(b.hasAttribute('data-review')){idx=saved.review[0];tab='join';render();return}if(b.hasAttribute('data-syllable')){say(d.s);status.textContent='🔊 '+d.s+' 글자 전체 소리를 들려줘요.';return}if(b.dataset.say){say(b.dataset.say);return}if(b.dataset.part){if(locked)return;let target=selected.length===0?d.c:d.v;if(b.dataset.part!==target){miss();status.textContent='앗! 다시 골라볼까요?';return}selected.push(target);b.disabled=true;b.classList.add('picked');$('built').textContent=selected.length===1?d.c+' + _ = ?':d.c+' + '+d.v+' = '+d.s;if(selected.length===2){locked=true;reward();status.textContent='짝짝! '+d.s+' 완성! ⭐';say(d.s)}else status.textContent='좋아요! 이제 모음을 찾아요.';return}if(b.dataset.answer){if(locked)return;if(b.dataset.answer===d.word){locked=true;reward();status.textContent='정답! '+d.word+' ⭐';say(d.word)}else{miss();status.textContent='한 번 더 살펴볼까요?'}return}if(b.dataset.food){if(locked)return;if(b.dataset.food===d.word){locked=true;reward();$('mascot').textContent='🐰😋';status.textContent='냠냠! '+d.word+' 정답! ⭐';say(d.word)}else{miss();status.textContent='토끼가 다른 간식을 찾고 있어요.'}}});updateProgress();render();
</script></body></html>
