<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2e8"><title>호수플레이 · 모음 소리 탐험</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#e6f5ff,#fff1e9);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#544a50}main{max-width:520px;margin:auto;padding:18px 14px 55px}header{text-align:center}h1{font-size:25px;margin:8px 0}p{line-height:1.55}.muted{font-size:13px;color:#857980}.tag{display:inline-block;background:#fff;padding:6px 14px;border-radius:99px;border:2px solid #ffe4c4;font-weight:800;font-size:12px}.progress{height:12px;background:white;border-radius:20px;overflow:hidden;margin:17px 0}.bar{height:100%;width:0;background:#ffca6c;transition:width .2s}.card{background:#fffdf9;border:3px solid white;border-radius:34px;padding:19px 16px;text-align:center;box-shadow:0 8px 0 #e7d7cd}.bunny{font-size:65px}.title{font-size:22px;font-weight:900;margin:9px 0}.step{font-size:12px;font-weight:850;color:#a17864}.big{font-size:92px;font-weight:900;color:#547fa6;margin:8px 0}.mouth{margin:12px auto;width:155px;height:130px;background:#ffe0cb;border:5px solid #f6c5ab;border-radius:46% 46% 44% 44%;display:flex;align-items:center;justify-content:center}.lips{background:#a64e65;border:7px solid #e98e9f}.open{width:64px;height:76px;border-radius:48%}.round{width:43px;height:49px;border-radius:50%}.forward{width:29px;height:40px;border-radius:50%;box-shadow:0 0 0 9px #f5b3bd}.wide{width:90px;height:20px;border-radius:50%}.tip{padding:12px;border-radius:18px;background:#edf7ff;margin:12px 0;line-height:1.6}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}button{border:0;border-radius:20px;padding:15px 8px;font:inherit;font-weight:850;cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #5e9de0;outline-offset:3px}button:disabled{opacity:.45}.option{background:#e5f3ff;font-size:38px;min-height:84px;box-shadow:0 4px 0 #c8dfef}.option.selected{background:#ffdf85}.primary{background:#ffdb82;width:100%;margin:7px 0;box-shadow:0 4px 0 #e6c46a}.secondary{background:#e8f5ff;width:100%;margin:7px 0}.status{min-height:56px;background:#fff0e8;padding:13px;border-radius:17px;font-weight:800;line-height:1.5;margin-top:12px}.actions{display:flex;gap:9px;margin-top:16px}.actions button{flex:1;background:white}.hidden{display:none}.sound{font-size:17px}.stars{font-weight:900;color:#b97827}.note{font-size:12px;text-align:left;background:#fff9ed;padding:11px;border-radius:15px;line-height:1.55;margin-top:13px}.shelf{display:flex;justify-content:center;gap:10px;font-size:35px;margin:14px}.parent{margin-top:20px;background:#fff;border-radius:24px;padding:14px}.parent summary{cursor:pointer;font-weight:850}.parent p{font-size:13px}footer{text-align:center;margin-top:18px;font-size:12px}a{color:#547a9b}</style></head><body><main><header><span class="tag">🐰 한글놀이터 · 1단원</span><h1>모음 소리 탐험</h1><p class="muted">ㅏ · ㅗ · ㅜ · ㅣ 를 보고, 듣고, 골라요</p><div><span id="stepcount">1 / 5</span>　<span class="stars" id="starcount">⭐ 0</span></div><div class="progress"><div class="bar" id="bar"></div></div></header><section class="card"><div class="bunny" id="bunny">🐰</div><div id="lesson"></div><div id="status" class="status" aria-live="polite">시작해 볼까요?</div><div class="actions"><button id="prev">← 이전</button><button id="next">다음 →</button></div></section><details class="parent"><summary>👩‍🏫 부모님 안내 · 학습 기록</summary><div id="parentinfo"></div><button class="secondary" id="reset">이 기기의 이 단원 기록 초기화</button></details><footer><a href="/hangul-test/">← 한글놀이터</a>　·　<a href="/">호수플레이 홈</a></footer></main><script>
'use strict';
const vowels=[{char:'ㅏ',sound:'아',shape:'open',guide:'입을 편안하게 크게 벌리고 소리를 내요.',hint:'입을 크게 벌려요'},{char:'ㅗ',sound:'오',shape:'round',guide:'입술을 동그랗게 모으고 소리를 내요.',hint:'입술을 동그랗게 모아요'},{char:'ㅜ',sound:'우',shape:'forward',guide:'입술을 앞으로 오므리고 소리를 내요.',hint:'입술을 앞으로 내밀어요'},{char:'ㅣ',sound:'이',shape:'wide',guide:'입술을 양옆으로 펴고 소리를 내요.',hint:'입술을 옆으로 펴요'}];
const $=id=>document.getElementById(id),key='hosu-vowel-unit1-v1';let record={stars:0,completed:[],wrong:[],tries:0};try{record={...record,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}let step=0,part=0,answer=null,checked=false,question=0;function store(){try{localStorage.setItem(key,JSON.stringify(record))}catch(e){}update()}function update(){$('starcount').textContent='⭐ '+record.stars;$('stepcount').textContent=(step+1)+' / 5';$('bar').style.width=((step+1)/5*100)+'%';$('parentinfo').innerHTML='<p>완료한 활동: '+record.completed.length+'개 / 5개</p><p>문제 풀이 횟수: '+record.tries+'회 · 다시 연습할 모음: '+(record.wrong.length?record.wrong.join(', '):'없음')+'</p><p>기록은 이 브라우저에만 저장돼요. 다른 기기와 동기화되지는 않아요.</p>'}function speak(t){if(!('speechSynthesis'in window)){$('status').textContent='이 브라우저는 음성 읽기를 지원하지 않아요.';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.72;u.onerror=()=>$('status').textContent='소리 재생에 실패했어요. Safari에서 다시 눌러보세요.';speechSynthesis.speak(u)}catch(e){$('status').textContent='소리를 재생하지 못했어요.'}}function award(){if(!record.completed.includes(step)){record.completed.push(step);record.stars++;store()}}function setStatus(t){$('status').textContent=t}function nextQuestion(){question=(question+1)%4;answer=null;checked=false;render()}function render(){update();$('prev').disabled=step===0;$('next').textContent=step===4?'처음으로 ↻':'다음 →';$('bunny').textContent=step===4?'🐰🥕':'🐰';let h='';if(step===0){let v=vowels[part];h='<div class="step">1단계 · 입모양 발견</div><div class="title">입모양을 따라 해봐!</div><div class="mouth"><div class="lips '+v.shape+'"></div></div><div class="big">'+v.char+'</div><div class="tip">'+v.guide+'</div><button class="primary" data-sound="'+v.sound+'">🔊 '+v.sound+' 듣기</button><div class="buttons">'+vowels.map((x,i)=>'<button class="option '+(i===part?'selected':'')+'" data-vowel="'+i+'">'+x.char+'</button>').join('')+'</div><div class="note">입모양 그림은 단순화된 학습용 시안이에요. 실제 발음 영상과 전문가 검수 음원은 아직 연결되지 않았어요. 현재 듣기는 기기 음성 합성으로 낱소리와 가까운 음절을 읽어줍니다.</div>';}
if(step===1){let v=vowels[question];h='<div class="step">2단계 · 소리 듣고 구별</div><div class="title">어떤 소리일까?</div><p>소리를 듣고 알맞은 글자를 골라봐!</p><button class="primary sound" data-sound="'+v.sound+'">🔊 문제 소리 듣기</button><div class="buttons">'+vowels.map(x=>'<button class="option '+(answer===x.char?'selected':'')+'" data-answer="'+x.char+'">'+x.char+'</button>').join('')+'</div><button class="secondary" data-check>정답 확인</button><button class="secondary" data-new>다른 소리 도전 →</button><p class="muted">듣기 문제에서는 답을 고르기 전 보기의 소리를 숨겨요.</p>';}
if(step===2){let v=vowels[question];h='<div class="step">3단계 · 글자와 소리 연결</div><div class="title">모음 카드를 읽어봐!</div><div class="big">'+v.char+'</div><p>'+v.hint+'</p><button class="primary" data-sound="'+v.sound+'">🔊 이 글자 소리 듣기</button><button class="secondary" data-new>다음 글자 →</button><p class="muted">글자를 먼저 보고 소리를 예상한 뒤 들어봐요.</p>';}
if(step===3){let v=vowels[question];h='<div class="step">4단계 · 모음 바꿔 보기</div><div class="title">입모양이 바뀌면 소리도 달라져!</div><div class="buttons">'+vowels.map((x,i)=>'<button class="option '+(question===i?'selected':'')+'" data-pick="'+i+'">'+x.char+'</button>').join('')+'</div><div class="mouth"><div class="lips '+v.shape+'"></div></div><div class="big">'+v.sound+'</div><button class="primary" data-sound="'+v.sound+'">🔊 '+v.sound+' 듣기</button><p class="muted">모음 버튼을 모두 눌러 입모양과 소리를 비교해 봐요.</p>';}
if(step===4){h='<div class="step">5단계 · 토끼의 복습 선물</div><div class="title">모음을 배웠어요!</div><div class="shelf">🥕 🍎 🍯 🌷</div><p>ㅏ · ㅗ · ㅜ · ㅣ</p><div class="buttons">'+vowels.map(x=>'<button class="option" data-sound="'+x.sound+'">'+x.char+'</button>').join('')+'</div><button class="primary" data-finish>⭐ 오늘의 별 받기</button><p class="muted">모음 카드를 하나씩 눌러 복습해요.</p>';}
$('lesson').innerHTML=h;setStatus(step===0?'모음 카드를 눌러 입모양을 비교해 봐요.':step===1?'먼저 소리를 듣고 글자를 골라봐요.':step===2?'글자를 보고 어떤 소리일지 말해봐요.':step===3?'글자를 누르면 입모양이 바뀌어요.':'토끼와 함께 배운 소리를 복습해요.')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='prev'){step=Math.max(0,step-1);render();return}if(b.id==='next'){step=(step+1)%5;answer=null;checked=false;render();return}if(b.id==='reset'){if(confirm('이 단원의 별과 학습 기록을 초기화할까요?')){record={stars:0,completed:[],wrong:[],tries:0};store();render()}return}if(b.dataset.sound){speak(b.dataset.sound);return}if(b.dataset.vowel!==undefined){part=Number(b.dataset.vowel);render();return}if(b.dataset.pick!==undefined){question=Number(b.dataset.pick);render();return}if(b.dataset.answer){answer=b.dataset.answer;document.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('selected',x.dataset.answer===answer));setStatus('선택했어요. 정답 확인을 눌러봐요.');return}if(b.hasAttribute('data-check')){if(!answer){setStatus('먼저 글자를 골라봐요.');return}if(checked){setStatus('다른 소리로 도전해 봐요.');return}checked=true;record.tries++;let target=vowels[question];if(answer===target.char){setStatus('정답! '+target.char+' = '+target.sound+' 🎉');record.wrong=record.wrong.filter(x=>x!==target.char);award()}else{setStatus('다시 들어볼까요? 정답은 '+target.char+'예요.');if(!record.wrong.includes(target.char))record.wrong.push(target.char)}store();return}if(b.hasAttribute('data-new')){nextQuestion();return}if(b.hasAttribute('data-finish')){award();setStatus('오늘의 학습 완료! 토끼가 별을 선물했어요. ⭐');$('bunny').textContent='🐰💛';return}});render();
</script></body></html>
