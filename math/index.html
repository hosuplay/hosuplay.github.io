<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수학 연습</title><link rel="stylesheet" href="style.css?v=4"></head><body><main><section id="welcome" class="welcome"><img src="math-illustration.png" alt="수학 기호들과 함께 즐겁게 수학 문제를 푸는 어린이" width="1254" height="1254"><button id="enterButton" class="primary">수학 연습 시작 →</button></section><div id="appContent" hidden><header><div><small>차근차근, 한 문제씩</small><h1>수학 연습<span>＋</span></h1></div><button id="homeButton" class="quiet">처음으로</button></header><section id="stats" class="stats" aria-label="학습 기록"></section><section id="home"><h2>무엇을 풀어 볼까요?</h2><div class="menus"><button data-mode="add"><b>＋</b>덧셈<small>두 자리부터 네 자리까지</small></button><button data-mode="multiply"><b>×</b>곱셈<small>계산 형태를 골라 연습해요</small></button><button data-mode="divide"><b>÷</b>나눗셈<small>몫과 나머지를 알아봐요</small></button><button data-mode="table"><b>2 × 9</b>구구단 게임<small>연습 또는 60초 도전</small></button></div><button id="reviewButton" class="review">틀린 문제 다시 풀기 <span id="wrongCount"></span></button></section><section id="play" hidden><div class="playhead"><h2 id="modeTitle"></h2><span id="challengeInfo"></span></div><div id="settings" class="settings"></div><article class="card"><div id="questionLabel" class="eyebrow">문제</div><div id="question" class="question"></div><section class="scratchpad" aria-label="계산 메모장"><div class="scratch-head"><strong>✏️ 계산 메모장</strong><span>손가락으로 자유롭게 써요</span></div><canvas id="scratchCanvas" aria-label="손글씨 계산 공간"></canvas><div class="scratch-actions"><button type="button" id="penButton" class="tool active" aria-pressed="true">연필</button><button type="button" id="eraserButton" class="tool" aria-pressed="false">지우개</button><button type="button" id="clearScratch" class="tool clear">전체 지우기</button></div></section><form id="answerForm"><div class="inputs"><label>답<input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="답 또는 몫"></label><label id="remainderLabel" hidden>나머지<input id="remainder" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label></div><button id="checkButton" class="primary">정답 확인</button></form><div id="choices" class="choices" hidden></div><div id="feedback" role="status" aria-live="polite"></div><button id="nextButton" class="primary" hidden>다음 문제 →</button><button id="startButton" class="primary" hidden>60초 도전 시작</button></article></section><footer>기록은 이 브라우저에 저장돼요. 부담 없이, 다시 도전해요.</footer><p id="storageNotice" role="status" hidden>브라우저에서 저장을 허용하지 않아 이번 학습 기록만 유지됩니다.</p></div></main><script src="script.js?v=4"></script></body></html>
