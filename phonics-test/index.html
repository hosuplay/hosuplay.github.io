<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dff2ff"><title>호수플레이 | 곰돌이 영어놀이터</title><style>*{box-sizing:border-box}body{margin:0;background:#dff2ff;color:#40505b;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:500px;margin:auto;padding:20px 14px 40px}header{text-align:center}h1{font-size:25px;margin:12px 0 6px}p{line-height:1.6}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}nav button{background:white;border-radius:18px;padding:12px 3px;font-size:13px;font-weight:700}nav button.active,.yellow{background:#ffdf82!important}.panel{border:3px solid #fff;background:#fffdf9;border-radius:35px;padding:22px 16px;text-align:center;box-shadow:0 8px 0 #b9dce9}.bear{font-size:72px;line-height:1.2}.bubble{background:#edf7ff;border:2px dashed #b9dcef;border-radius:25px;padding:10px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.tile{border-radius:19px;background:#e3f2ff;padding:20px 8px;font-size:30px;font-weight:800;min-height:78px}.tile.selected{background:#ffdf82}.big{width:100%;border-radius:22px;padding:17px;background:#ffdf82;font-size:18px;font-weight:800;margin:8px 0}.outline{background:#e6f4ff}.small{font-size:13px;color:#73808a}.status{min-height:48px;font-size:17px;font-weight:700}.food{font-size:56px}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.choices button{font-size:39px;background:#e9f6ff;border-radius:20px;padding:12px}.pill{display:inline-block;background:#fff1bd;border-radius:20px;padding:5px 12px;font-size:13px}footer{text-align:center;margin-top:20px;font-size:12px;color:#667985}</style></head><body><main><header><h1>🧸 호수플레이 영어놀이터</h1><p>우리 아기곰이랑 놀면서 배우자!</p></header><nav><button data-tab="sound" class="active">① 음가</button><button data-tab="blend">② 합치기</button><button data-tab="feed">③ 냠냠게임</button><button data-tab="speak">④ 말하기</button></nav><section class="panel"><div class="bear" aria-hidden="true">🧸</div><div id="content"></div><div class="bubble status" id="status" aria-live="polite"></div></section><footer>기존 호수플레이와 분리된 테스트 화면 · 음가 오디오는 검수 후 연결</footer></main><script>const content=document.querySelector('#content'),status=document.querySelector('#status');let tab='sound',wordIndex=0,sequence=[],score=0;const words=[{word:'sun',letters:['s','u','n'],meaning:'해',emoji:'☀️'},{word:'map',letters:['m','a','p'],meaning:'지도',emoji:'🗺️'},{word:'bat',letters:['b','a','t'],meaning:'박쥐',emoji:'🦇'}];function sayWord(word){if(!('speechSynthesis' in window)){status.textContent='이 브라우저는 단어 음성 재생을 지원하지 않아.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.8;u.onerror=()=>status.textContent='음성 재생이 안 됐어. Safari에서 다시 눌러봐.';speechSynthesis.speak(u);status.textContent='🔊 '+word+' 단어 듣기'}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));sequence=[];if(tab==='sound'){content.innerHTML='<h2>글자의 소리를 찾아보자</h2><p class="small">음가와 단어 발음은 달라! 검수된 음가 녹음이 연결되기 전에는 잘못된 소리를 들려주지 않을게.</p><div class="grid">'+['m','s','a','t','b','c'].map(x=>'<button class="tile" data-phoneme="'+x+'">'+x+'</button>').join('')+'</div><span class="pill">🔇 음가 오디오 준비 중</span>';status.textContent='글자를 눌러봐!'}else if(tab==='blend'){const w=words[wordIndex];content.innerHTML='<h2>글자를 순서대로 골라봐!</h2><p>그림을 보고 단어를 완성해 보자</p><div class="food">'+w.emoji+'</div><div class="bubble" id="built">_ _ _</div><div class="grid">'+[...w.letters].reverse().map((x,i)=>'<button class="tile" data-letter="'+x+'" data-id="'+i+'">'+x+'</button>').join('')+'</div><button class="big" data-next>다음 단어 →</button><button class="big outline" data-word="'+w.word+'">🔊 완성 단어 듣기</button>';status.textContent='글자 카드를 차례로 눌러봐.'}else if(tab==='feed'){const w=words[wordIndex];content.innerHTML='<h2>아기곰이 배고프대!</h2><p>🔊 단어를 듣고 알맞은 그림 간식을 골라줘</p><button class="big" data-word="'+w.word+'">🔊 문제 단어 듣기</button><div class="choices">'+[w.emoji,...words.filter(v=>v.word!==w.word).map(v=>v.emoji)].sort().map(e=>'<button data-food="'+e+'">'+e+'</button>').join('')+'</div><p class="small">맞히면 아기곰이 냠냠! 🍯</p><button class="big outline" data-next>다음 문제 →</button><p>획득한 하트: <strong>'+score+'</strong> ❤️</p>';status.textContent='어떤 그림일까?'}else{content.innerHTML='<h2>따라 말해 볼까?</h2><p>먼저 단어를 듣고 천천히 따라 해봐.</p><button class="big" data-word="sun">🔊 sun 듣기</button><button class="big outline" id="mic">🎤 내가 말하기</button><p class="small">마이크는 브라우저 지원과 권한이 필요해. 녹음 파일은 이 페이지에서 저장하지 않아.</p>';status.textContent='준비되면 마이크를 눌러봐.'}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.phoneme){status.textContent=b.dataset.phoneme+'의 정확한 음가 오디오는 준비 중이야. 단어를 대신 읽지 않을게.'}else if(b.dataset.letter){const w=words[wordIndex];if(sequence.length>=w.letters.length)return;const expected=w.letters[sequence.length];if(b.dataset.letter!==expected){status.textContent='한 번 더 생각해 볼까?';return}sequence.push(expected);b.disabled=true;b.classList.add('selected');document.querySelector('#built').textContent=sequence.join(' ')+' '+Array(w.letters.length-sequence.length).fill('_').join(' ');if(sequence.length===w.letters.length){status.textContent='정답! '+w.word+' ('+w.meaning+') 🎉';sayWord(w.word)}else status.textContent='좋아! 다음 글자는?'}else if(b.dataset.food){const w=words[wordIndex];if(b.dataset.food===w.emoji){score++;status.textContent='냠냠! 🧸💛 정답! '+w.word+' = '+w.meaning;b.textContent='🧸💛';b.disabled=true}else status.textContent='아기곰이 다시 골라달래!'}else if(b.hasAttribute('data-next')){wordIndex=(wordIndex+1)%words.length;render()}else if(b.dataset.word){sayWord(b.dataset.word)}else if(b.id==='mic'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='이 브라우저는 음성 인식을 지원하지 않아. 듣고 따라 말하기로 연습해 보자.';return}try{const r=new R();r.lang='en-US';r.onresult=e=>status.textContent='들린 말: '+e.results[0][0].transcript;r.onerror=e=>status.textContent='마이크 오류: '+e.error;status.textContent='듣고 있어…';r.start()}catch(e){status.textContent='마이크를 시작하지 못했어.'}}});render();</script></body></html>
