<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호수플레이 곰돌이 파닉스</title><style>body{margin:0;background:#dff5ff;font-family:system-ui,-apple-system,sans-serif;color:#384b56}main{max-width:460px;margin:auto;padding:22px 16px;text-align:center}h1{font-size:27px}.bear{font-size:90px;margin:8px}.panel{background:white;border-radius:28px;padding:22px 14px;box-shadow:0 8px 20px #90bbcf55}nav{display:flex;gap:6px;margin:18px 0}button{border:0;border-radius:18px;background:#ffe48a;padding:14px 12px;font-size:17px;font-weight:750;color:#39454c;cursor:pointer}nav button{flex:1;font-size:13px;background:white}nav button.active{background:#ffda72}.tiles{display:flex;justify-content:center;gap:12px;margin:20px 0}.tiles button{background:#e1f2ff;font-size:38px;width:82px;height:95px}.primary{width:100%;background:#ffda72;margin:8px 0}.secondary{background:#e5f2fb;margin:5px}.status{min-height:48px;margin:16px 0;font-size:18px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.options button{background:#e7f5ff;font-size:19px}.small{font-size:13px;color:#657987}#content{min-height:260px}</style></head><body><main><h1>🐻 호수플레이 처음 영어</h1><p>우리 곰돌이랑 소리 놀이!</p><nav><button data-tab="sound" class="active">① 소리</button><button data-tab="blend">② 합치기</button><button data-tab="quiz">③ 카드놀이</button><button data-tab="speak">④ 말하기</button></nav><div class="panel"><div class="bear">🐻</div><div id="content"></div><p class="small" id="support"></p></div></main><script>
const area=document.getElementById('content'),support=document.getElementById('support');let tab='sound',picked=0;const phonemes=[['m','mmm','moon'],['s','sss','sun'],['a','ă','apple'],['t','t','top'],['b','b','ball'],['c','k','cat']];function say(word){try{if(!('speechSynthesis' in window)){support.textContent='이 브라우저는 음성 읽기를 지원하지 않아.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.72;u.pitch=1.1;u.onerror=()=>support.textContent='음성이 차단됐어. Safari에서 웹주소로 열고 소리 버튼을 다시 눌러봐.';speechSynthesis.speak(u);support.textContent='🔊 '+word+' 재생 요청';}catch(e){support.textContent='음성 재생 오류: '+e.message}}function render(){support.textContent='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='sound'){area.innerHTML='<h2>글자를 누르고 들어봐!</h2><p>소리 예시 단어를 들려줘.</p><div class="options">'+phonemes.map((p,i)=>'<button data-sound="'+i+'">'+p[0]+'</button>').join('')+'</div><p class="status" id="status">어떤 글자를 눌러볼까?</p>'}if(tab==='blend'){area.innerHTML='<h2>소리를 합쳐보자!</h2><div class="tiles"><button data-part="b">b</button><button data-part="a">a</button><button data-part="t">t</button></div><button class="primary" data-word="bat">🔊 bat 단어 듣기</button><p class="status">b + a + t = bat ⚾</p><p class="small">글자별 버튼은 해당 소리가 들어간 예시를 재생해. 정확한 개별 음가는 추후 별도 녹음 예정!</p>'}if(tab==='quiz'){area.innerHTML='<h2>듣고 맞혀봐!</h2><button class="primary" data-word="sun">🔊 문제 듣기</button><div class="options"><button data-answer="no">🐻 곰</button><button data-answer="yes">☀️ 해</button><button data-answer="no">⚾ 공</button></div><p class="status" id="status">어떤 그림일까?</p>'}if(tab==='speak'){area.innerHTML='<h2>내가 말해볼게!</h2><p>먼저 단어를 듣고 따라 해봐.</p><button class="secondary" data-word="bat">🔊 bat 듣기</button><button class="primary" id="mic">🎤 말해보기</button><p class="status" id="status">마이크를 눌러봐!</p><p class="small">마이크는 브라우저 지원 및 권한이 필요해.</p>'}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.sound!==undefined){const p=phonemes[+b.dataset.sound];document.getElementById('status').textContent=p[0]+' — '+p[2];say(p[2])}else if(b.dataset.part){say(({b:'ball',a:'apple',t:'top'})[b.dataset.part])}else if(b.dataset.word){say(b.dataset.word)}else if(b.dataset.answer){document.getElementById('status').textContent=b.dataset.answer==='yes'?'정답! ☀️ 잘했어!':'다시 들어볼까? 🐻'}else if(b.id==='mic'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='이 브라우저에서는 음성 인식을 지원하지 않아.';return}let r=new R();r.lang='en-US';r.onresult=e=>document.getElementById('status').textContent='들린 말: '+e.results[0][0].transcript;r.onerror=e=>document.getElementById('status').textContent='마이크 오류: '+e.error;document.getElementById('status').textContent='듣고 있어...';r.start()}});render();</script></body></html>
