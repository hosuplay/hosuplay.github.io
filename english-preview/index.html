<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호수플레이 영어 · 새 디자인 미리보기</title><style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#252a34;background:#f7f7f4}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{font-weight:900;letter-spacing:-1px;font-size:21px}.sub{font-size:12px;color:#888}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #5d7cf6;outline-offset:3px}.tiny{border:1px solid #e2e4e7;background:white;border-radius:14px;padding:10px 13px}.eyebrow{font-size:12px;font-weight:800;color:#6479d4;letter-spacing:1px}.hero{background:#e7eafc;border-radius:28px;padding:27px;margin-bottom:20px}.hero h1{font-size:30px;line-height:1.3;margin:10px 0}.hero p{color:#666e89;margin:0;font-size:14px}.progress{height:7px;border-radius:9px;background:#d3d9f4;margin-top:22px;overflow:hidden}.progress>div{height:100%;width:0;background:#5c6fe5;transition:.3s}.section{font-size:19px;font-weight:850;margin:25px 0 15px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{min-height:168px;text-align:left;border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}.tile:active{transform:scale(.97)}.tile:nth-child(1){background:#f8e7e1}.tile:nth-child(2){background:#e8eee3}.tile:nth-child(3){background:#e5edfa}.tile:nth-child(4){background:#f0e8f5}.tile:nth-child(5){background:#fff0d8;grid-column:span 2;min-height:124px}.num{font-size:12px;font-weight:800;opacity:.55}.tile strong{font-size:21px}.tile small{font-size:12px;color:#63666e;line-height:1.5}.tile .arrow{align-self:flex-end;font-size:24px}.lesson{display:none}.lesson.active{display:block}.home.hidden{display:none}.back{background:transparent;padding:8px 0;margin-bottom:20px;color:#5c6477}.panel{background:white;border-radius:28px;padding:24px 20px;box-shadow:0 5px 22px #20253508}.panel h2{font-size:25px;margin:8px 0 8px}.hint{color:#7c818d;font-size:14px;line-height:1.6}.visual{height:190px;background:#f6f7fa;border-radius:22px;margin:20px 0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:65px;font-weight:900;letter-spacing:2px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:78px;background:#f3f4f8;border-radius:18px;font-size:25px;font-weight:800;color:#353a46}.choice:active,.choice.selected{background:#dce4ff}.primary{width:100%;background:#313c77;color:white;border-radius:17px;padding:17px;margin-top:15px;font-weight:800}.feedback{min-height:28px;font-size:14px;font-weight:750;margin:16px 0 0}.tag{display:inline-block;background:#eef1fb;color:#4b60b7;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:750}.bottom{margin-top:22px;color:#a0a3ab;text-align:center;font-size:12px}@media(max-width:390px){.hero h1{font-size:26px}.tile{padding:16px}.tile strong{font-size:19px}}body{background:#fff9ed;background-image:radial-gradient(#f7e8ce 1px,transparent 1px);background-size:24px 24px}.logo{color:#3b609b}.hero{background:#ffedbd;border:3px solid #fff;box-shadow:0 8px 0 #f6d9a2}.hero h1{color:#654c31}.eyebrow{color:#e08a38}.tile{border:3px solid white;box-shadow:0 5px 0 #e9e2d5;min-height:190px}.tile strong{font-size:23px}.tile .num{font-size:37px;opacity:1}.tile .arrow{background:white;border-radius:50%;width:35px;height:35px;text-align:center;line-height:32px}.tile:nth-child(5){min-height:150px}.panel{border:3px solid #fff0d2;box-shadow:0 8px 0 #f3e4c7}.panel h2{color:#3e5487}.visual{background:#fff1d5;border:3px dashed #f2cb81;font-size:clamp(45px,12vw,76px)}.choice{background:#e9f1ff;border:3px solid white;border-radius:22px;min-height:90px;box-shadow:0 4px 0 #d1dff3}.choice.selected{background:#c9f4ce}.primary{background:#ffae42;color:#5b3b18;box-shadow:0 5px 0 #e48a23}.feedback{color:#34934d;font-size:18px}.tag{background:#ffedb6;color:#8c651d}.tiny{background:#fff4d7}.section{color:#4c5c86}</style></head><body><div class="app"><header><div><div class="logo">hosuplay <span style="color:#7b8cdd">/ English</span></div><div class="sub">듣고 · 누르고 · 읽는 영어 놀이터</div></div><button class="tiny" id="sound">🔊 소리 켜짐</button></header><main class="home" id="home"><section class="hero"><div class="eyebrow">LET’S PLAY ENGLISH!</div><h1>오늘은 어떤 소리를<br>배워볼까?</h1><p>하나씩 듣고, 합치고, 읽어보자.</p><div class="progress"><div id="bar"></div></div><p style="margin-top:9px" id="count">완료 0 / 5</p></section><div class="section">영어 놀이</div><div class="menu" id="menu"></div><p class="bottom">디자인 체험판 · 기존 호수플레이와 별도</p></main><section class="lesson" id="lesson"><button class="back" id="back">← 영어 놀이로 돌아가기</button><div class="panel"><span class="tag" id="stage"></span><h2 id="title"></h2><div class="hint" id="hint"></div><div class="visual" id="visual"></div><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="primary" id="next">다시 듣기 🔊</button></div><p class="bottom">미리보기 · 음성은 기기 음성 합성 사용</p></section></div><script>
const lessons=[
{title:'알파벳',desc:'글자 이름과 소리',color:'',hint:'A의 이름은 에이. 단어 속에서는 /æ/ 소리가 나요.',visual:'A a',question:'apple의 첫 글자는?',options:['A','E','I'],answer:0,say:'apple'},
{title:'파닉스 44음가',desc:'하나씩 정확하게 듣기',hint:'ch는 두 글자가 만나 한 소리가 돼요.',visual:'ch 🐥',question:'ch로 시작하는 단어는?',options:['sun','chip','dog'],answer:1,say:'chip'},
{title:'소리 합치기',desc:'소리를 이어 단어 만들기',hint:'c · a · t 를 천천히 이어 읽어봐.',visual:'c · a · t',question:'소리를 합치면 어떤 단어일까?',options:['cat','cut','cot'],answer:0,say:'cat'},
{title:'단어·문장 읽기',desc:'짧은 문장까지 읽기',hint:'그림을 보고 문장을 소리 내어 읽어봐.',visual:'🐱 📖',question:'고양이라는 뜻의 단어는?',options:['dog','sun','cat'],answer:2,say:'It is a cat'},
{title:'듣고 맞히기',desc:'귀로 듣고 정답 고르기',hint:'아래 소리 버튼을 눌러 단어를 듣고 골라봐.',visual:'🎧',question:'어떤 단어가 들렸을까?',options:['sun','cat','pen'],answer:0,say:'sun'}
];
let active=-1,completed=new Set(),muted=false,advanceTimer=null,locked=false;const $=id=>document.getElementById(id);
$('menu').innerHTML=lessons.map((x,i)=>'<button class="tile" data-i="'+i+'"><span class="num">0'+(i+1)+'</span><div><strong>'+x.title+'</strong><br><small>'+x.desc+'</small></div><span class="arrow">↗</span></button>').join('');
function speak(t){if(muted)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)}catch(e){$('feedback').textContent='이 기기에서는 음성을 재생할 수 없어요.'}}
function show(i){clearTimeout(advanceTimer);locked=false;active=i;let x=lessons[i];$('home').classList.add('hidden');$('lesson').classList.add('active');$('stage').textContent='STEP 0'+(i+1);$('title').textContent=x.title;$('hint').textContent=x.hint+' '+x.question;$('visual').textContent=x.visual;$('feedback').textContent='';$('next').textContent='🔊 소리 듣기';$('choices').innerHTML=x.options.map((o,j)=>'<button class="choice" data-choice="'+j+'">'+o+'</button>').join('');window.scrollTo(0,0)}
$('menu').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)});
$('choices').addEventListener('click',e=>{let b=e.target.closest('[data-choice]');if(!b)return;if(locked)return;let ok=+b.dataset.choice===lessons[active].answer;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('feedback').textContent=ok?'정답! 잘했어 ✨':'한 번 더 들어보고 골라보자.';if(ok){locked=true;completed.add(active);$('bar').style.width=(completed.size*20)+'%';$('count').textContent='완료 '+completed.size+' / 5';$('next').textContent='✨ 잘했어! 잠시 후 다음 놀이';advanceTimer=setTimeout(()=>{if(active===4)back();else show(active+1)},1050)}});
$('next').onclick=()=>{if($('next').textContent.includes('다음 놀이'))show(active+1);else if($('next').textContent.includes('처음으로'))back();else speak(lessons[active].say)};
function back(){clearTimeout(advanceTimer);locked=false;$('lesson').classList.remove('active');$('home').classList.remove('hidden');window.scrollTo(0,0)}$('back').onclick=back;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐'};
</script></body></html>
