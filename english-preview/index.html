<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호수플레이 영어 · 새 디자인 미리보기</title><style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#252a34;background:#f7f7f4}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{font-weight:900;letter-spacing:-1px;font-size:21px}.sub{font-size:12px;color:#888}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #5d7cf6;outline-offset:3px}.tiny{border:1px solid #e2e4e7;background:white;border-radius:14px;padding:10px 13px}.eyebrow{font-size:12px;font-weight:800;color:#6479d4;letter-spacing:1px}.hero{background:#e7eafc;border-radius:28px;padding:27px;margin-bottom:20px}.hero h1{font-size:30px;line-height:1.3;margin:10px 0}.hero p{color:#666e89;margin:0;font-size:14px}.progress{height:7px;border-radius:9px;background:#d3d9f4;margin-top:22px;overflow:hidden}.progress>div{height:100%;width:0;background:#5c6fe5;transition:.3s}.section{font-size:19px;font-weight:850;margin:25px 0 15px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{min-height:168px;text-align:left;border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}.tile:active{transform:scale(.97)}.tile:nth-child(1){background:#f8e7e1}.tile:nth-child(2){background:#e8eee3}.tile:nth-child(3){background:#e5edfa}.tile:nth-child(4){background:#f0e8f5}.tile:nth-child(5){background:#fff0d8;grid-column:span 2;min-height:124px}.num{font-size:12px;font-weight:800;opacity:.55}.tile strong{font-size:21px}.tile small{font-size:12px;color:#63666e;line-height:1.5}.tile .arrow{align-self:flex-end;font-size:24px}.lesson{display:none}.lesson.active{display:block}.home.hidden{display:none}.back{background:transparent;padding:8px 0;margin-bottom:20px;color:#5c6477}.panel{background:white;border-radius:28px;padding:24px 20px;box-shadow:0 5px 22px #20253508}.panel h2{font-size:25px;margin:8px 0 8px}.hint{color:#7c818d;font-size:14px;line-height:1.6}.visual{height:190px;background:#f6f7fa;border-radius:22px;margin:20px 0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:65px;font-weight:900;letter-spacing:2px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:78px;background:#f3f4f8;border-radius:18px;font-size:25px;font-weight:800;color:#353a46}.choice:active,.choice.selected{background:#dce4ff}.primary{width:100%;background:#313c77;color:white;border-radius:17px;padding:17px;margin-top:15px;font-weight:800}.feedback{min-height:28px;font-size:14px;font-weight:750;margin:16px 0 0}.tag{display:inline-block;background:#eef1fb;color:#4b60b7;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:750}.bottom{margin-top:22px;color:#a0a3ab;text-align:center;font-size:12px}@media(max-width:390px){.hero h1{font-size:26px}.tile{padding:16px}.tile strong{font-size:19px}}body{background:#fff9ed;background-image:radial-gradient(#f7e8ce 1px,transparent 1px);background-size:24px 24px}.logo{color:#3b609b}.hero{background:#ffedbd;border:3px solid #fff;box-shadow:0 8px 0 #f6d9a2}.hero h1{color:#654c31}.eyebrow{color:#e08a38}.tile{border:3px solid white;box-shadow:0 5px 0 #e9e2d5;min-height:190px}.tile strong{font-size:23px}.tile .num{font-size:37px;opacity:1}.tile .arrow{background:white;border-radius:50%;width:35px;height:35px;text-align:center;line-height:32px}.tile:nth-child(5){min-height:150px}.panel{border:3px solid #fff0d2;box-shadow:0 8px 0 #f3e4c7}.panel h2{color:#3e5487}.visual{background:#fff1d5;border:3px dashed #f2cb81;font-size:clamp(45px,12vw,76px)}.choice{background:#e9f1ff;border:3px solid white;border-radius:22px;min-height:90px;box-shadow:0 4px 0 #d1dff3}.choice.selected{background:#c9f4ce}.primary{background:#ffae42;color:#5b3b18;box-shadow:0 5px 0 #e48a23}.feedback{color:#34934d;font-size:18px}.tag{background:#ffedb6;color:#8c651d}.tiny{background:#fff4d7}.section{color:#4c5c86}.lesson-top{display:flex;align-items:center;justify-content:space-between}.star{font-size:30px;color:#f5ae3e}.listen-btn{width:100%;background:#fff3d3;color:#72521d;padding:15px;border-radius:18px;font-weight:850;margin:-2px 0 18px;border:2px solid #f6d894}.choice.correct{background:#bdf0c7;border-color:#69c985;animation:pop .35s ease}.tile{position:relative;overflow:hidden}.tile:active{transform:scale(.96)}.tile:nth-child(1){background:#ffd8cb}.tile:nth-child(2){background:#d7eacb}.tile:nth-child(3){background:#cddffc}.tile:nth-child(4){background:#e6d5f4}.tile:nth-child(5){background:#ffe7ae}.tile strong{line-height:1.35}.tile small{display:inline-block;margin-top:6px}.hero{position:relative;overflow:hidden}.hero:after{content:'✿';position:absolute;right:15px;top:12px;color:#f7bf65;font-size:70px;opacity:.7}.panel{background:#fffefa}.hint{font-size:17px;color:#5d6270;font-weight:600}.choice{font-size:26px}.choice:hover{background:#d8e8ff}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:390px){.tile{min-height:180px}.tile:nth-child(5){min-height:140px}.tile strong{font-size:20px}.visual{height:175px}} </style></head><body><div class="app"><header><div><div class="logo">hosuplay <span style="color:#7b8cdd">/ English</span></div><div class="sub">듣고 · 누르고 · 읽는 영어 놀이터</div></div><button class="tiny" id="sound">🔊 소리 켜짐</button></header><main class="home" id="home">
<section class="hero"><div class="eyebrow">HOSU ENGLISH CLUB ✦</div><h1>오늘도 영어랑<br>놀아볼까? 🐻</h1><p>소리도 듣고, 글자도 맞혀봐!</p><div class="progress"><div id="bar"></div></div><p style="margin-top:10px" id="count">완료 0 / 5</p></section>
<div class="section">골라서 놀기 <span style="font-size:15px">🎈</span></div><div class="menu" id="menu"></div><p class="bottom">호수플레이 · 어린이 영어 놀이 미리보기</p></main>
<section class="lesson" id="lesson"><button class="back" id="back">← 놀이 고르기</button><div class="panel"><span class="tag" id="stage"></span><div class="lesson-top"><h2 id="title"></h2><div class="star">✦</div></div><div class="hint" id="hint"></div><div class="visual" id="visual"></div><button class="listen-btn" id="listenBtn">🔊 소리 듣기</button><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="primary" id="next">한 번 더 듣기 🔊</button></div><p class="bottom">정답을 맞히면 자동으로 다음 놀이로 이동해요</p></section></div><script>
const sets=[
{title:'알파벳',desc:'글자랑 친해지기',icon:'🔤',items:[
{visual:'🍎',question:'Apple은 어떤 글자로 시작할까?',options:['A','E','I'],answer:0,say:'Apple'},
{visual:'🐻',question:'Bear는 어떤 글자로 시작할까?',options:['D','B','P'],answer:1,say:'Bear'},
{visual:'🐱',question:'Cat은 어떤 글자로 시작할까?',options:['C','K','T'],answer:0,say:'Cat'},
{visual:'🐶',question:'Dog는 어떤 글자로 시작할까?',options:['B','G','D'],answer:2,say:'Dog'},
{visual:'🐘',question:'Elephant는 어떤 글자로 시작할까?',options:['E','A','F'],answer:0,say:'Elephant'}]},
{title:'파닉스 소리',desc:'글자가 내는 소리',icon:'🎵',items:[
{visual:'🪑 ch',question:'ch 소리로 시작하는 단어는?',options:['chip','sun','map'],answer:0,say:'chip'},
{visual:'🐟 sh',question:'sh 소리로 시작하는 단어는?',options:['hat','ship','dog'],answer:1,say:'ship'},
{visual:'🌞 s',question:'s 소리로 시작하는 단어는?',options:['cat','pen','sun'],answer:2,say:'sun'},
{visual:'🐸 f',question:'f 소리로 시작하는 단어는?',options:['fish','bus','run'],answer:0,say:'fish'},
{visual:'🦊 x',question:'끝에 x 소리가 나는 단어는?',options:['hat','fox','pig'],answer:1,say:'fox'}]},
{title:'소리 합치기',desc:'한 소리씩 이어보기',icon:'🧩',items:[
{visual:'c · a · t',question:'이어 읽으면 어떤 단어일까?',options:['cut','cat','cot'],answer:1,say:'cat'},
{visual:'s · u · n',question:'이어 읽으면 어떤 단어일까?',options:['sun','sin','son'],answer:0,say:'sun'},
{visual:'p · e · n',question:'이어 읽으면 어떤 단어일까?',options:['pin','pan','pen'],answer:2,say:'pen'},
{visual:'d · o · g',question:'이어 읽으면 어떤 단어일까?',options:['dog','dig','dug'],answer:0,say:'dog'},
{visual:'h · a · t',question:'이어 읽으면 어떤 단어일까?',options:['hot','hit','hat'],answer:2,say:'hat'}]},
{title:'단어 읽기',desc:'그림 보고 읽기',icon:'📚',items:[
{visual:'🐱',question:'고양이를 영어로?',options:['cat','cap','car'],answer:0,say:'cat'},
{visual:'☀️',question:'해를 영어로?',options:['sit','sun','son'],answer:1,say:'sun'},
{visual:'🐶',question:'강아지를 영어로?',options:['dig','dot','dog'],answer:2,say:'dog'},
{visual:'🎩',question:'모자를 영어로?',options:['hat','hot','hit'],answer:0,say:'hat'},
{visual:'🐷',question:'돼지를 영어로?',options:['big','pig','pin'],answer:1,say:'pig'}]},
{title:'듣고 맞히기',desc:'귀 쫑긋 듣기 퀴즈',icon:'🎧',items:[
{visual:'🎧',question:'소리를 듣고 단어를 골라봐!',options:['cat','sun','pen'],answer:1,say:'sun'},
{visual:'🎧',question:'이번에는 어떤 단어일까?',options:['dog','pig','hat'],answer:0,say:'dog'},
{visual:'🎧',question:'귀 기울여 들어봐!',options:['map','cap','cat'],answer:2,say:'cat'},
{visual:'🎧',question:'들린 단어를 눌러봐!',options:['pin','pen','pan'],answer:1,say:'pen'},
{visual:'🎧',question:'마지막 문제야!',options:['fish','dish','ship'],answer:0,say:'fish'}]}
];
let active=-1,questionIndex=0,locked=false,muted=false,advanceTimer=null,completed=new Set(),score=0;
const $=id=>document.getElementById(id);
$('menu').innerHTML=sets.map((x,i)=>'<button class="tile" data-i="'+i+'"><span class="num">'+x.icon+'</span><div><strong>'+x.title+'</strong><br><small>'+x.desc+'</small></div><span class="arrow">↗</span></button>').join('');
function speak(t){if(muted)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}catch(e){$('feedback').textContent='이 기기에서는 음성이 지원되지 않아.'}}
function render(){locked=false;let set=sets[active],q=set.items[questionIndex];$('home').classList.add('hidden');$('lesson').classList.add('active');$('stage').textContent=set.icon+' '+(questionIndex+1)+' / '+set.items.length;$('title').textContent=set.title;$('hint').textContent=q.question;$('visual').textContent=q.visual;$('feedback').textContent='';$('next').textContent='🔊 다시 듣기';$('choices').innerHTML=q.options.map((o,j)=>'<button class="choice" data-choice="'+j+'">'+o+'</button>').join('');window.scrollTo(0,0);if(active===4)setTimeout(()=>{if(!locked&&active===4)speak(q.say)},350)}
function show(i){clearTimeout(advanceTimer);active=i;questionIndex=0;render()}
function updateProgress(){$('bar').style.width=(completed.size*20)+'%';$('count').textContent='완료 '+completed.size+' / 5';}
$('menu').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)show(+b.dataset.i)});
$('choices').addEventListener('click',e=>{let b=e.target.closest('[data-choice]');if(!b||locked)return;let q=sets[active].items[questionIndex],ok=+b.dataset.choice===q.answer;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(ok){locked=true;b.classList.add('correct');score++;$('feedback').textContent='🌟 정답! 다음 문제로 슝!';$('next').textContent='✨ 잘했어!';advanceTimer=setTimeout(()=>{if(questionIndex+1<sets[active].items.length){questionIndex++;render()}else{completed.add(active);updateProgress();showFinish()}},1000)}else{$('feedback').textContent='💛 아깝다! 다시 골라볼까?';speak(q.say)}});
function showFinish(){locked=true;$('stage').textContent='🏆 CLEAR!';$('title').textContent='참 잘했어!';$('hint').textContent='5문제를 모두 풀었어! 다른 놀이도 해보자.';$('visual').textContent='🏆🌟🎉';$('choices').innerHTML='';$('feedback').textContent='완료한 놀이 '+completed.size+' / 5';$('next').textContent='다른 놀이 고르기';}
function back(){clearTimeout(advanceTimer);locked=false;$('lesson').classList.remove('active');$('home').classList.remove('hidden');window.scrollTo(0,0)}
$('back').onclick=back;$('listenBtn').onclick=()=>{if(active>=0)speak(sets[active].items[Math.min(questionIndex,4)].say)};
$('next').onclick=()=>{if($('next').textContent==='다른 놀이 고르기')back();else if(active>=0)speak(sets[active].items[questionIndex].say)};
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐'};
</script></body></html>
