<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분수 스피드 배틀 | 호수플레이</title><style>*{box-sizing:border-box}body{margin:0;background:#080b15;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:540px;margin:auto;padding:25px 18px 70px}a{color:#a5b4fc;text-decoration:none}.tag{color:#65e8e0;letter-spacing:3px;font-size:12px;font-weight:800}h1{font-size:35px;letter-spacing:-1px;margin:10px 0}p{color:#9ba7be}.panel{background:#151c30;border:1px solid #293650;border-radius:25px;padding:23px;margin:18px 0;box-shadow:0 10px 35px #0005}.modes,.choices{display:grid;gap:13px}.choices{grid-template-columns:1fr 1fr}button{font:inherit;touch-action:manipulation;cursor:pointer;border:1px solid #3d4b66;border-radius:18px;min-height:65px;padding:15px;color:white;background:#202b44;font-weight:850}button:active{transform:scale(.97)}.primary{background:linear-gradient(120deg,#6458ee,#298de0);border:0}.choice{font-size:25px;min-height:96px}.stats{display:flex;justify-content:space-between;gap:8px;font-weight:800;color:#8deee1}.problem{font-size:45px;font-weight:850;text-align:center;padding:28px 0}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1.08}.frac span:first-child{border-bottom:2px solid;padding:0 8px 5px}.frac span:last-child{padding-top:5px}.feedback{min-height:30px;font-weight:800;color:#75e2ce}.small{font-size:14px;color:#a5b1c9}.end{font-size:28px;text-align:center}.rank-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid #293650;gap:10px}.rank-row:last-child{border-bottom:0}.rank-name{font-weight:850}.rank-meta{color:#9ba7be;font-size:13px}.name-input{width:100%;border:1px solid #52627e;border-radius:14px;padding:15px;background:#0c1426;color:#fff;font:inherit;font-size:18px;margin:10px 0}.rank-note{font-size:12px;color:#9ba7be}.rank-actions{display:flex;gap:10px;margin-top:12px}.rank-actions button{flex:1;min-height:50px;font-size:14px}</style></head><body><main><a href="/">← 호수플레이</a><div class="tag" style="margin-top:32px">HOSU PLAY · MATH ARENA</div><h1>⚡ 분수 스피드 배틀</h1><p>가분수 · 대분수 · 자연수 변신 게임</p><div id="app"></div></main><script>
const app=document.getElementById('app');let mode='speed',qs=[],idx=0,score=0,combo=0,left=0,timer=null,locked=false,started=0;
const f=(n,d)=>'<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';const mixed=(w,n,d)=>w+' '+f(n,d);const shuffle=a=>a.sort(()=>Math.random()-.5);
function question(){let d=2+Math.floor(Math.random()*7),w=1+Math.floor(Math.random()*4),n=1+Math.floor(Math.random()*(d-1)),t=Math.floor(Math.random()*3),prompt,correct,answers;
if(t===0){prompt=f(w*d+n,d);correct=mixed(w,n,d);answers=[correct,mixed(w+1,n,d),mixed(w,n===d-1?1:n+1,d),mixed(w+2,n,d)]}
else if(t===1){prompt=mixed(w,n,d);correct=f(w*d+n,d);answers=[correct,f(w*d+n+1,d),f(w*d+n-1,d),f((w+1)*d+n,d)]}
else{prompt=String(w);correct=f(w*d,d);answers=[correct,f(w*d+1,d),f((w+1)*d,d),f(w*d-1,d)]}
return{prompt,correct,answers:shuffle(answers),type:['가분수를 대분수로!','대분수를 가분수로!','자연수를 분수로!'][t]}}
const STORAGE='hosu-fraction-ranks-v1';let finalSeconds=0;const modeLabel={speed:'⚡ 스피드',bomb:'💣 폭탄',mix:'🔀 변신'};function getRanks(){try{const a=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}function saveRank(name){let a=getRanks();a.push({name:name.slice(0,12),mode,score,secs:finalSeconds,date:new Date().toLocaleDateString('ko-KR')});a.sort((x,y)=>y.score-x.score||x.secs-y.secs);try{localStorage.setItem(STORAGE,JSON.stringify(a.slice(0,100)))}catch(e){alert('이 브라우저에서는 기록을 저장할 수 없어.')}ranking(mode)}function ranking(selected){clearInterval(timer);let modes=['speed','bomb','mix'];let rows=getRanks().filter(x=>x.mode===selected).sort((a,b)=>b.score-a.score||a.secs-b.secs).slice(0,10);app.innerHTML='<div class="panel"><h2>🏆 명예의 전당</h2><p class="rank-note">이 기기의 브라우저에 저장된 기록이야. 다른 기기와는 공유되지 않아.</p><div class="rank-actions">'+modes.map(m=>'<button data-rank="'+m+'" style="'+(m===selected?'border-color:#75e2ce':'')+'">'+modeLabel[m]+'</button>').join('')+'</div><div id="ranklist">'+(rows.length?rows.map((r,i)=>'<div class="rank-row"><div><span class="rank-name">'+['🥇','🥈','🥉'][i%3].repeat(i<3?1:0)+(i>=3?(i+1)+'위 ':' ')+escapeHtml(r.name)+'</span><div class="rank-meta">'+r.date+'</div></div><div style="text-align:right"><b>'+r.score+'점</b><div class="rank-meta">'+r.secs+'초</div></div></div>').join(''):'<p>아직 기록이 없어! 첫 랭커가 되어봐 😎</p>')+'</div><button class="primary" id="backrank" style="width:100%;margin-top:18px">게임으로 돌아가기</button></div>';app.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>ranking(b.dataset.rank));document.getElementById('backrank').onclick=home}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){clearInterval(timer);app.innerHTML='<div class="panel"><h2>게임 모드 선택</h2><div class="modes"><button class="primary" data-mode="speed">⚡ 스피드 모드<br><span class="small">10문제 · 기록 도전</span></button><button data-mode="bomb">💣 폭탄 모드<br><span class="small">문제마다 8초 제한</span></button><button data-mode="mix">🔀 변신 모드<br><span class="small">15문제 · 콤보 도전</span></button><button id="ranks">🏆 랭킹 보기</button></div></div>';app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));document.getElementById('ranks').onclick=()=>ranking('speed')}
function start(m){mode=m;qs=Array.from({length:m==='mix'?15:10},question);idx=0;score=0;combo=0;started=Date.now();show()}
function show(){clearInterval(timer);locked=false;if(idx>=qs.length){finish();return}let q=qs[idx];left=mode==='bomb'?8:0;app.innerHTML='<div class="panel"><div class="stats"><span>ROUND '+(idx+1)+'/'+qs.length+'</span><span>⭐ '+score+'점</span><span id="clock">'+(mode==='bomb'?'⏱ '+left+'초':'🔥 '+combo+' COMBO')+'</span></div><p>'+q.type+'</p><div class="problem">'+q.prompt+'</div><div class="choices">'+q.answers.map((a,i)=>'<button class="choice" data-i="'+i+'">'+a+'</button>').join('')+'</div><p class="feedback" id="feedback"></p></div><button id="exit">게임 나가기</button>';app.querySelector('#exit').addEventListener('click',home);app.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));if(mode==='bomb'){timer=setInterval(()=>{left--;let el=document.getElementById('clock');if(el)el.textContent='⏱ '+left+'초';if(left<=0){clearInterval(timer);answer(-1)}},1000)}}
function answer(i){if(locked)return;locked=true;clearInterval(timer);let q=qs[idx],ok=i>=0&&q.answers[i]===q.correct;combo=ok?combo+1:0;if(ok)score+=10+Math.min(combo-1,5)*2;let feedback=document.getElementById('feedback');feedback.textContent=ok?'정답! ⚡ +'+(10+Math.min(combo-1,5)*2)+'점':i===-1?'시간 초과! 💣':'아쉬워! 다시 도전!';feedback.style.color=ok?'#75e2ce':'#ff9aa5';app.querySelectorAll('[data-i]').forEach(b=>{b.disabled=true;if(q.answers[Number(b.dataset.i)]===q.correct)b.style.borderColor='#75e2ce';else if(Number(b.dataset.i)===i)b.style.borderColor='#ff7285'});setTimeout(()=>{idx++;show()},900)}
function finish(){finalSeconds=Math.round((Date.now()-started)/1000);app.innerHTML='<div class="panel end"><div style="font-size:60px">🏆</div><h2>배틀 완료!</h2><p>총 '+score+'점 · '+finalSeconds+'초</p><div style="text-align:left"><label for="playername" class="small">랭킹에 남길 이름 (최대 12자)</label><input id="playername" class="name-input" maxlength="12" placeholder="닉네임 입력" autocomplete="nickname"><button class="primary" id="save" style="width:100%">🏆 내 기록 등록하기</button><p class="rank-note">기록은 현재 기기의 브라우저에만 저장돼.</p></div><button id="again">다시 도전하기</button><button id="menu" style="margin-left:8px">모드 선택</button></div>';document.getElementById('save').onclick=()=>{const name=document.getElementById('playername').value.trim();if(!name){alert('이름을 입력해줘!');return}saveRank(name)};document.getElementById('again').onclick=()=>start(mode);document.getElementById('menu').onclick=home}
home();
</script></body></html>
