<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d18"><title>분수 레벨업 아레나 | HOSU PLAY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:570px;margin:auto;padding:22px 16px 80px}a{color:#a5b4fc;text-decoration:none}.eyebrow{font-size:12px;color:#69e8dd;letter-spacing:2.5px;font-weight:800;margin-top:25px}h1{font-size:32px;letter-spacing:-1.4px;margin:10px 0 6px}h2{font-size:21px;margin:5px 0 15px}p{color:#a4b1c7;line-height:1.5}.panel{background:#151e31;border:1px solid #2d3a55;border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 10px 30px #0004}.muted{font-size:13px;color:#a4b1c7}.accent{color:#72e6d8}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{font:inherit;touch-action:manipulation;cursor:pointer;border:1px solid #465676;border-radius:15px;min-height:52px;padding:13px 15px;color:white;background:#23304b;font-weight:800}button:disabled{opacity:.45;cursor:default}.primary{background:linear-gradient(120deg,#6b55ed,#268be2);border:0}.teal{background:#164c50;border-color:#347b7b}input{width:100%;padding:15px;background:#0c1323;color:white;border:1px solid #546582;border-radius:14px;font:inherit;font-size:18px}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1.05;font-size:1em}.frac span:first-child{border-bottom:2px solid;padding:0 7px 4px}.frac span:last-child{padding-top:4px}.problem{text-align:center;font-size:44px;font-weight:850;padding:16px 0 26px}.choice{font-size:23px;min-height:90px}.choice.correct{border-color:#72e6d8;background:#184c49}.choice.wrong{border-color:#ff7f91;background:#512637}.progress{height:10px;background:#283750;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#6d58ef,#64e9dd);transition:width .2s}.note{background:#0e1728;border:1px solid #344663;border-radius:15px;padding:14px;margin:13px 0;line-height:1.7}.note strong{color:#83e7dd}.scratch{border:1px solid #40516d;border-radius:16px;overflow:hidden;background:#111b2c}.scratch canvas{display:block;width:100%;height:180px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}.scratch-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px;background:#1b2940}.scratch-tools button{min-height:38px;padding:7px 12px;font-size:13px}.rankrow{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #34415c}.rankrow:last-child{border:0}.big{font-size:30px;font-weight:900}.tiny{font-size:12px;color:#98a7c1}.status{color:#70e7da;font-weight:800;min-height:24px}.hidden{display:none}.pill{display:inline-block;background:#283553;border-radius:99px;padding:7px 11px;font-size:12px;color:#c7d5ee}
</style></head><body><main><a href="/">← 호수플레이 홈</a><div class="eyebrow">HOSU PLAY · MATH ARENA</div><h1>⚡ 분수 레벨업 아레나</h1><p>20문제마다 레벨업! 틀린 문제는 복습으로 정복하자.</p><div id="app"></div></main>
<script>
"use strict";
const app=document.getElementById('app'),KEY='hosu-fraction-arena-v2',RANK='hosu-fraction-ranks-v2';
let player=null,session=null,drawCleanup=null;
const frac=(n,d)=>'<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';
const showVal=v=>v.kind==='whole'?String(v.w):v.kind==='mixed'?v.w+' '+frac(v.n,v.d):frac(v.n,v.d);
const valKey=v=>v.kind==='whole'?'w'+v.w:v.kind==='mixed'?'m'+v.w+'-'+v.n+'-'+v.d:'f'+v.n+'-'+v.d;
const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(player))}catch(e){alert('브라우저 저장 공간이 부족하거나 저장이 차단됐어.')}} 
function basePlayer(name){return{name,level:1,progress:0,answered:0,correct:0,used:[],wrong:[],history:[],rewarded:[],created:Date.now()}}
function validate(p){return p&&typeof p.name==='string'&&Array.isArray(p.used)&&Array.isArray(p.wrong)&&Array.isArray(p.history)&&Array.isArray(p.rewarded)}
function screen(markup){if(drawCleanup){drawCleanup();drawCleanup=null}app.innerHTML=markup}
function welcome(){const old=read(KEY,null);screen('<div class="panel"><h2>🎮 플레이어 입장</h2><label class="muted" for="nick">닉네임을 입력해줘 (최대 12자)</label><input id="nick" maxlength="12" autocomplete="nickname" placeholder="나만의 닉네임을 입력해 주세요" value="'+(validate(old)?esc(old.name):'')+'"><div class="stack" style="margin-top:14px"><button class="primary" id="enter">게임 시작하기 ⚡</button>'+(validate(old)?'<button id="resume">이전 기록 이어서 하기 · LV.'+old.level+'</button>':'')+'<button id="rank">🏆 랭킹 보기</button></div><p class="tiny">실명 대신 별명을 사용해 주세요. 기록은 이 기기·브라우저에 저장돼요.</p></div>');document.getElementById('enter').onclick=()=>{const n=document.getElementById('nick').value.trim();if(!n)return alert('닉네임을 입력해줘!');player=validate(old)&&old.name===n?old:basePlayer(n);save();lobby()};if(validate(old))document.getElementById('resume').onclick=()=>{player=old;lobby()};document.getElementById('rank').onclick=()=>ranking()}
function lobby(){session=null;screen('<div class="panel"><div class="row"><div><div class="pill">PLAYER · '+esc(player.name)+'</div><h2 style="margin-top:12px">LEVEL '+player.level+' ⚡</h2></div><div style="font-size:48px">🏆</div></div><div class="row muted"><span>다음 레벨까지</span><span>'+player.progress+'/20 문제</span></div><div class="progress"><div style="width:'+(player.progress/20*100)+'%"></div></div><p class="muted">총 '+player.answered+'문제 도전 · 정답 '+player.correct+'개 · 오답 '+player.wrong.length+'개 보관</p></div><div class="panel stack"><h2>게임 선택</h2><button class="primary" id="play">⚡ 새로운 문제 풀기<br><span class="tiny">20문제마다 레벨 +1 · 중복 출제 방지</span></button><button class="teal" id="review">📘 오답 복습하기 ('+player.wrong.length+'문제)<br><span class="tiny">묶음 전체 정답 시 레벨 +1</span></button><button id="history">📝 내 오답노트 · 풀이 확인</button><button id="rank">🏆 랭킹 보기</button><button id="change">플레이어 변경</button></div>');document.getElementById('play').onclick=()=>start('normal');document.getElementById('review').onclick=()=>start('review');document.getElementById('history').onclick=wrongBook;document.getElementById('rank').onclick=ranking;document.getElementById('change').onclick=welcome}
function questionPool(){const pool=[];for(let d=2;d<=12;d++)for(let w=1;w<=12;w++){for(let n=1;n<d;n++){const improper={kind:'fraction',n:w*d+n,d},mixed={kind:'mixed',w,n,d};pool.push(makeQ('improper',improper,mixed),makeQ('mixed',mixed,improper))}pool.push(makeQ('whole',{kind:'whole',w},{kind:'fraction',n:w*d,d}))}return pool}
function makeQ(type,ask,correct){return{id:type+':'+valKey(ask),type,ask,correct}}
const POOL=questionPool();
function candidates(q){let {type,correct}=q,opts=[correct],d=correct.d||q.ask.d,w=correct.w||q.ask.w||Math.floor(correct.n/d),n=correct.n||q.ask.n||1;
if(type==='improper'){const choices=[{kind:'mixed',w:w+1,n,d},{kind:'mixed',w:Math.max(1,w-1),n,d},{kind:'mixed',w,n:n===d-1?1:n+1,d},{kind:'mixed',w:w+2,n,d}];opts.push(...choices)}
else{const num=correct.n;opts.push({kind:'fraction',n:num+1,d},{kind:'fraction',n:num-1,d},{kind:'fraction',n:num+d,d},{kind:'fraction',n:Math.max(1,num-d),d})}
opts=[...new Map(opts.map(o=>[valKey(o),o])).values()];return shuffle(opts.slice(0,4))}
function explain(q){let d=q.correct.d||q.ask.d;if(q.type==='improper'){let total=q.ask.n,w=Math.floor(total/d),rem=total%d;return '① '+total+' ÷ '+d+' = '+w+' … '+rem+'<br>② 몫 '+w+'는 자연수 부분, 나머지 '+rem+'은 분자야.<br>③ 분모 '+d+'는 그대로!<br><strong>정답: '+showVal(q.correct)+'</strong>'}
if(q.type==='mixed'){let w=q.ask.w,n=q.ask.n;return '① 자연수 '+w+' × 분모 '+d+' = '+(w*d)+'<br>② 여기에 분자 '+n+'을 더해 '+(w*d+n)+'<br>③ 분모 '+d+'는 그대로!<br><strong>정답: '+showVal(q.correct)+'</strong>'}
return '① 자연수 '+q.ask.w+'는 '+d+'개씩 '+q.ask.w+'묶음이야.<br>② '+q.ask.w+' × '+d+' = '+q.correct.n+'<br>③ 분모는 '+d+', 분자는 '+q.correct.n+'<br><strong>정답: '+showVal(q.correct)+'</strong>'}
function start(kind){if(kind==='review'&&!player.wrong.length)return alert('아직 복습할 오답이 없어!');let list;
if(kind==='review'){list=shuffle(player.wrong.map(x=>POOL.find(q=>q.id===x.id)).filter(Boolean));if(!list.length)return alert('복습할 문제를 찾지 못했어.');}
else{const used=new Set(player.used);let available=POOL.filter(q=>!used.has(q.id));if(available.length<20){player.used=[];available=POOL.slice()}list=shuffle(available).slice(0,20-player.progress)}
session={kind,list,idx:0,missed:0,score:0,start:Date.now(),results:[]};questionScreen()}
function questionScreen(){if(session.idx>=session.list.length)return finish();const q=session.list[session.idx],opts=candidates(q);session.opts=opts;session.answered=false;screen('<div class="panel"><div class="row"><span class="pill">'+(session.kind==='review'?'📘 복습 챌린지':'⚡ LEVEL '+player.level)+'</span><span class="accent">'+(session.idx+1)+' / '+session.list.length+'</span></div><div class="progress"><div style="width:'+(session.idx/session.list.length*100)+'%"></div></div><p>'+(q.type==='improper'?'가분수를 대분수로 바꿔봐':q.type==='mixed'?'대분수를 가분수로 바꿔봐':'자연수를 분수로 나타내 봐')+'</p><div class="problem">'+showVal(q.ask)+'</div><div class="grid" id="choices">'+opts.map((v,i)=>'<button class="choice" data-answer="'+i+'">'+showVal(v)+'</button>').join('')+'</div><div id="explanation" class="hidden"></div><button id="next" class="primary hidden" style="width:100%;margin-top:12px">다음 문제 →</button></div><div class="panel"><div class="row"><h2>✍️ 연습장</h2><span class="muted">손가락으로 계산해 봐</span></div><div class="scratch"><canvas id="pad" aria-label="손글씨 연습장"></canvas><div class="scratch-tools"><span class="tiny">화면에 직접 써봐!</span><button id="clearpad">전체 지우기</button></div></div></div><button id="quit" style="width:100%">나가기</button>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.answer)));document.getElementById('next').onclick=()=>{session.idx++;questionScreen()};document.getElementById('quit').onclick=()=>{if(confirm('현재 도전을 끝내고 나갈까? 완료한 문제 기록은 유지돼.'))lobby()};initPad()}
function choose(i){if(session.answered)return;session.answered=true;const q=session.list[session.idx],chosen=session.opts[i],ok=valKey(chosen)===valKey(q.correct);session.results.push({id:q.id,ok});if(ok)session.score+=10;else session.missed++;
if(session.kind==='normal'){player.used.push(q.id);player.answered++;if(ok)player.correct++;else if(!player.wrong.some(x=>x.id===q.id))player.wrong.push({id:q.id});player.history.unshift({id:q.id,ok,when:Date.now()});player.history=player.history.slice(0,200);player.progress++;if(player.progress===20){player.progress=0;player.level++}save()}
document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const v=session.opts[Number(b.dataset.answer)];if(valKey(v)===valKey(q.correct))b.classList.add('correct');else if(Number(b.dataset.answer)===i)b.classList.add('wrong')});
const el=document.getElementById('explanation');el.className='note';el.innerHTML='<strong>'+(ok?'정답! +10점 🎉':'아쉬워! 오답노트에 기록할게 📘')+'</strong><div style="margin-top:10px">'+explain(q)+'</div>';document.getElementById('next').classList.remove('hidden')}
function finish(){const s=session,elapsed=Math.max(1,Math.round((Date.now()-s.start)/1000));let reward=false;if(s.kind==='review'&&s.missed===0){const signature=s.list.map(q=>q.id).sort().join('|');if(!player.rewarded.includes(signature)){player.rewarded.push(signature);player.level++;reward=true}const solved=new Set(s.list.map(q=>q.id));player.wrong=player.wrong.filter(x=>!solved.has(x.id));save()}if(s.kind==='normal'){let ranks=read(RANK,[]);ranks.push({name:player.name,score:s.score,time:elapsed,date:new Date().toLocaleDateString('ko-KR'),mode:'level'});ranks.sort((a,b)=>b.score-a.score||a.time-b.time);try{localStorage.setItem(RANK,JSON.stringify(ranks.slice(0,100)))}catch(e){}}
screen('<div class="panel" style="text-align:center"><div style="font-size:60px">🏆</div><h2>'+(s.kind==='review'?'복습 완료!':'도전 완료!')+'</h2><div class="big">'+s.score+'점</div><p>'+s.list.length+'문제 중 '+(s.list.length-s.missed)+'개 정답 · '+elapsed+'초</p><p class="accent">현재 LEVEL '+player.level+'</p>'+(reward?'<div class="note">🎊 오답 전체 정복! 보너스 레벨 +1</div>':s.kind==='review'&&s.missed?'<div class="note">복습에서 틀린 문제가 있어. 다시 모두 맞히면 보상을 받을 수 있어!</div>':'')+'<div class="stack"><button class="primary" id="home">내 게임 화면으로</button><button id="book">오답노트 보기</button></div></div>');document.getElementById('home').onclick=lobby;document.getElementById('book').onclick=wrongBook}
function wrongBook(){const entries=player.wrong.map(x=>POOL.find(q=>q.id===x.id)).filter(Boolean);screen('<div class="panel"><h2>📘 '+esc(player.name)+'의 오답노트</h2><p>틀린 문제 '+entries.length+'개 · 풀이과정 복습</p>'+(entries.length?entries.slice(0,40).map((q,i)=>'<div class="note"><div><b>'+(i+1)+'. '+showVal(q.ask)+'</b> → '+showVal(q.correct)+'</div><div style="margin-top:10px">'+explain(q)+'</div></div>').join(''):'<p>아직 틀린 문제가 없어. 멋져! ✨</p>')+'<div class="stack"><button class="primary" id="review">오답 다시 풀기</button><button id="back">돌아가기</button></div></div>');document.getElementById('review').onclick=()=>start('review');document.getElementById('back').onclick=lobby}
function ranking(){const ranks=read(RANK,[]).slice().sort((a,b)=>b.score-a.score||a.time-b.time).slice(0,10);screen('<div class="panel"><h2>🏆 이 기기의 랭킹 TOP 10</h2><p class="tiny">닉네임 · 점수 · 기록시간. 온라인 전체 랭킹은 아직 지원하지 않아.</p>'+(ranks.length?ranks.map((r,i)=>'<div class="rankrow"><div>'+(i<3?['🥇','🥈','🥉'][i]:(i+1)+'위')+' <b>'+esc(r.name)+'</b><div class="tiny">'+esc(r.date)+'</div></div><div style="text-align:right"><b>'+r.score+'점</b><div class="tiny">'+r.time+'초</div></div></div>').join(''):'<p>아직 기록이 없어!</p>')+'<button id="back" class="primary" style="width:100%;margin-top:15px">돌아가기</button></div>');document.getElementById('back').onclick=()=>player?lobby():welcome}
function initPad(){
  const c=document.getElementById('pad'),ctx=c.getContext('2d');
  let pointerId=null,touchId=null,last=null,initialized=false;

  function resize(){
    const rect=c.getBoundingClientRect();
    const ratio=Math.min(window.devicePixelRatio||1,2);
    const width=Math.round(rect.width*ratio),height=Math.round(rect.height*ratio);
    if(!width||!height||(initialized&&c.width===width&&c.height===height))return;
    const snapshot=document.createElement('canvas');
    snapshot.width=c.width;
    snapshot.height=c.height;
    snapshot.getContext('2d').drawImage(c,0,0);
    c.width=width;
    c.height=height;
    initialized=true;
    ctx.setTransform(width/rect.width,0,0,height/rect.height,0,0);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle=ctx.fillStyle='#d4e9ff';
    ctx.lineWidth=3;
    ctx.drawImage(snapshot,0,0,rect.width,rect.height);
  }

  const pos=point=>{
    const rect=c.getBoundingClientRect();
    return {x:point.clientX-rect.left,y:point.clientY-rect.top};
  };
  function start(point){
    last=pos(point);
    ctx.beginPath();
    ctx.arc(last.x,last.y,1.5,0,Math.PI*2);
    ctx.fill();
  }
  function move(point){
    const next=pos(point);
    ctx.beginPath();
    ctx.moveTo(last.x,last.y);
    ctx.lineTo(next.x,next.y);
    ctx.stroke();
    last=next;
  }

  // Cancel Safari's native gestures for touches that begin on the canvas.
  const touchOptions={passive:false};
  const cancelGesture=e=>{if(e.cancelable)e.preventDefault()};
  c.addEventListener('touchstart',e=>{
    cancelGesture(e);
    if(touchId!==null||pointerId!==null)return;
    const touch=e.changedTouches[0];
    touchId=touch.identifier;
    start(touch);
  },touchOptions);
  c.addEventListener('touchmove',e=>{
    cancelGesture(e);
    if(touchId===null)return;
    const touch=Array.from(e.changedTouches).find(t=>t.identifier===touchId);
    if(touch)move(touch);
  },touchOptions);
  function endTouch(e){
    if(touchId===null||!Array.from(e.changedTouches).some(t=>t.identifier===touchId))return;
    touchId=null;
    last=null;
  }
  c.addEventListener('touchend',endTouch);
  c.addEventListener('touchcancel',endTouch);

  // Touch Events own finger input so each stroke is drawn only once.
  c.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch'||e.button!==0||pointerId!==null||touchId!==null)return;
    pointerId=e.pointerId;
    try{c.setPointerCapture(pointerId)}catch(e){}
    start(e);
  });
  c.addEventListener('pointermove',e=>{
    if(e.pointerId===pointerId)move(e);
  });
  function endPointer(e){
    if(e.pointerId!==pointerId)return;
    pointerId=null;
    last=null;
  }
  c.addEventListener('pointerup',endPointer);
  c.addEventListener('pointercancel',endPointer);
  c.addEventListener('lostpointercapture',endPointer);
  c.addEventListener('pointerleave',e=>{
    if(!c.hasPointerCapture(e.pointerId))endPointer(e);
  });
  c.addEventListener('contextmenu',cancelGesture);

  resize();
  document.getElementById('clearpad').onclick=()=>ctx.clearRect(0,0,c.width,c.height);
  window.addEventListener('resize',resize);
  drawCleanup=()=>window.removeEventListener('resize',resize);
}
welcome();
</script></body></html>
